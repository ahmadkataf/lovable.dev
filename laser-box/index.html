<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b45309" />
    <title>مولّد صناديق الليزر</title>
    <meta name="description" content="صمّم صناديق خشبية للقص بالليزر: اختر الشكل، اضبط القياسات والسماكة، ونزّل ملف SVG أو DXF جاهزاً للقص." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      // If the app fails to start (an old WebView, a broken saved state), say so instead of leaving a blank page,
      // with a button that clears what was saved and starts again
      (function () {
        var shown = false
        function show(msg) {
          var a = document.getElementById('app')
          if (shown || !a || a.childElementCount) return
          shown = true
          a.innerHTML = '<div style="padding:24px;font:16px/1.7 sans-serif;direction:rtl;color:#222;background:#fff">' +
            '<p><b>تعذّر تشغيل التطبيق.</b> اضغط الزرّ لمسح الإعدادات المحفوظة والبدء من جديد. إن تكرّر ذلك فحدّث «Android System WebView» و«Chrome» من متجر Play، وأرسل صورة هذه الشاشة.</p>' +
            '<button id="lb-reset" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#b45309;color:#fff">مسح الإعدادات وإعادة التشغيل</button>' +
            '<pre style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;color:#777;margin-top:16px"></pre></div>'
          a.querySelector('pre').textContent = String(msg) + '\n' + navigator.userAgent
          a.querySelector('#lb-reset').onclick = function () { try { localStorage.clear() } catch (e) {} location.hash = ''; location.reload() }
        }
        window.addEventListener('error', function (e) { show((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')) })
        window.addEventListener('unhandledrejection', function (e) { show('promise: ' + (e.reason && e.reason.message || e.reason)) })
        window.addEventListener('load', function () { setTimeout(function () { show('the app did not start') }, 6000) })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
