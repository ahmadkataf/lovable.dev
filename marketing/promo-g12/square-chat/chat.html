<script>
const $=id=>document.getElementById(id)
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), P=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,x)=>a+(b-a)*x
const eo3=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eoE=x=>x>=1?1:1-Math.pow(2,-10*x), eiE=x=>x<=0?0:Math.pow(2,10*x-10)
const eB=(x,s=1.7)=>{x=clamp(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}
function rv(el,t,t0,dur=.45,tOut=null,od=.25){const x=P(t,t0,t0+dur);let y=(1-eoE(x))*115,o=0;if(tOut!=null){o=P(t,tOut,tOut+od);y-=eio(o)*115}el.style.transform=`translateY(${y}%)`;el.style.opacity=(x<=0||o>=1)?0:1}
function slam(el,t,t0,dur=.3,from=1.9){const x=P(t,t0,t0+dur);el.style.opacity=clamp(x*5);el.style.transform=`scale(${lerp(from,1,eoE(x))})`;el.style.filter=`blur(${(1-eoE(x))*14}px)`}
for(let i=0;i<3;i++){const d=document.createElement('div');d.style.cssText='position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:4px solid #1CB0F6';$('rings').appendChild(d)}

// ---- chat script: [time, who, html, popOut]
const T1='مجد! كيف عم تدرس إنجليزي البكالوريا؟ 😩'
const MSG=[
  [3.6,'me',T1,true],
  [4.25,'me','أنا ضايعة بين الكلمات والقواعد والنماذج',true],
  [5.5,'them','نزّلت تطبيق <b>إمار ١٢</b> 😎',true],
  [6.8,'them','فيه الكتاب كامل، وكل كلمة بصوت طبيعي، وتمارين محلولة بالعربي',true],
  [7.8,'me','طيب والامتحانات؟ 🤔',true],
  [8.9,'them','نماذج بشكل البكالوريا تماماً، ومع التصحيح ⏱',true],
  [9.75,'me','ابعتلي ياه 🙏',true],
  [10.35,'them','CARD',true],
  [16.9,'me','يا عمي شو هاد 😍 اشتركت!',true],
]
const TYPING=[[4.75,5.5],[6.15,6.8],[8.3,8.9],[9.95,10.35]]  // Majd typing windows
const CARD=`<div class="card"><div class="top"><div class="icon" style="width:72px;height:72px;font-size:36px">12</div><div style="text-align:right"><div style="font-weight:900;font-size:24px">إمار ١٢</div><div style="font-size:14px;font-weight:600;color:#5b546b">إنجليزي البكالوريا</div></div></div><div class="bd"><div style="font-weight:800;font-size:17px">الكتاب كامل + امتحانات بكالوريا</div><div style="font-size:14.5px;color:#58a700;font-weight:700">الوحدة الأولى مجاناً 🎁</div></div><div class="btn">افتح التطبيق</div></div>`
const items=[] // {el,inner,t,end,h,type,idx}
const msgs=$('msgs')
function addItem(t,end,html,cls,type,idx){const w=document.createElement('div');w.className='it';const b=document.createElement('div');b.className=cls;b.innerHTML=html;w.appendChild(b);msgs.appendChild(w);items.push({el:w,inner:b,t,end,type,idx});return b}
// interleave typing indicators and messages chronologically
const ev=[]; MSG.forEach((m,i)=>ev.push({t:m[0],kind:'m',i})); TYPING.forEach(([a,b],k)=>ev.push({t:a,kind:'d',a,b}))
ev.sort((x,y)=>x.t-y.t)
for(const e of ev){
  if(e.kind=='d') addItem(e.a,e.b,'<div class="dots"><i></i><i></i><i></i></div>','b them','dots',-1)
  else {const [t,who,html]=MSG[e.i]; const isCard=html=='CARD'; const b=addItem(t,99,isCard?CARD:html+`<span class="tm">9:4${1+Math.min(8,e.i)} ${who=='me'?'✓✓':''}</span>`,'b '+(who=='me'?'me':'them')+(isCard?' cardb':''),'msg',e.i); if(isCard){b.style.padding='4px';b.style.background='transparent';b.style.boxShadow='none'}}
}
const VPH=822-124-72; let SCROLL=0, react

function layoutChat(t){
  let H=0
  for(const it of items){
    let k=0
    if(t>=it.t){ k = it.type=='dots' ? eoE(P(t,it.t,it.t+.2))*(1-eio(P(t,it.end-.12,it.end))) : eoE(P(t,it.t,it.t+.28)) }
    if(it.type=='dots' && t>=it.end) k=0
    it.el.style.height=(it.h*k)+'px'; it.el.style.display=k<=0?'none':'block'
    const s=it.type=='dots'?k:eB(P(t,it.t,it.t+.35),2.2)
    it.inner.style.transform=`scale(${Math.max(0,s)})`
    if(it.type=='dots') [...it.inner.querySelectorAll('i')].forEach((d,j)=>d.style.transform=`translateY(${-Math.max(0,Math.sin(t*9-j*.9))*6}px)`)
    H+=it.h*k
  }
  const scroll=Math.max(0,H+24-VPH); msgs.style.transform=`translateY(${-scroll}px)`
  return scroll
}
// pre-pass: settled rect of pop-out messages (relative to screen)
const POPS=[]
function prepass(){ const scr=$('screen').getBoundingClientRect()
  for(const it of items){ if(it.type!='msg'||!MSG[it.idx][3]) continue
    layoutChat(it.t+.6); const r=it.inner.getBoundingClientRect()
    const c=document.createElement('div'); c.className='pop'; c.style.cssText=`width:${r.width}px;height:${r.height}px`
    const inner=it.inner.cloneNode(true); inner.style.transform='none'; inner.style.margin='0'; inner.style.maxWidth='none'; inner.style.width=r.width+'px'; inner.style.height=r.height+'px'; inner.style.boxShadow='0 26px 50px rgba(23,19,31,.28)'
    if(inner.classList.contains('cardb')) inner.querySelector('.card').style.boxShadow='0 30px 60px rgba(23,19,31,.3)'
    c.appendChild(inner); $('bpops').appendChild(c); POPS.push({c,it,t:it.t})
  }
}
let INIT=false
function init(){INIT=true
  items.forEach(it=>{it.h=it.el.offsetHeight})
  react=document.createElement('div');react.className='react';react.textContent='❤️';items.find(i=>i.idx==8).inner.appendChild(react)
  prepass()
}

const W=[0.0,0.32,0.62,1.0,1.32]
const SEG=[11.75,12.95,14.15,15.35], SEG_END=16.4
const CAPS=[['01','الكتاب','كامل'],['02','صوت','طبيعي 🔊'],['03','تمارين','محلولة ✅'],['04','امتحانات','بكالوريا ⏱']]
const POPT=SEG.map(s=>s+.25)
function pose(i){const left=i%2==0;return{x:left?330:750,ry:left?20:-20}}

function render(t){
  if(!INIT) init()
  const B=[['g1',300,300,260,200,.09,.11],['g2',850,800,220,240,.12,.08],['g3',800,200,240,200,.07,.1]]
  for(const [id,cx,cy,ax,ay,fx,fy] of B) $(id).style.transform=`translate(${cx+ax*Math.sin(t*fx*6.28+cx)-450}px,${cy+ay*Math.cos(t*fy*6.28+cy)-450}px)`
  const SC=[['sA',0,1.85],['sC',1.6,19.05],['sE',18.7,99]]
  for(const [id,a,b] of SC) $(id).style.opacity=(t>=a&&t<b)?1:0
  // ---- hook
  if(t<1.9){ $('sA').style.transform=`scale(${1+t*.05})`
    for(let i=0;i<5;i++){const el=$('w'+i),a=W[i],b=W[i+1]??1.62
      if(t<a||t>b+.14){el.style.opacity=0;continue}
      if(t<b) slam(el,t,a,.26,1.9); else {const o=P(t,b,b+.14);el.style.opacity=1-o;el.style.transform=`scale(${1+eiE(o)*1.2})`;el.style.filter=`blur(${o*12}px)`}}
  }
  // ---- phone
  if(t>=1.6&&t<19.1){
    let x=540,ry=0,y=113,sc=1,rz=0,rx=5
    const inE=eoE(P(t,1.62,2.35)); if(t<2.4){x=540;y=lerp(1100,113,inE);ry=lerp(-40,0,inE);rz=lerp(10,0,inE)}
    // chat idle sway
    if(t<11.0){ry+=Math.sin(t*.8)*5}
    // enter app: zoom toward card then out to montage pose
    const zi=P(t,11.0,11.45), zo=P(t,11.45,11.85)
    if(t>=11.0&&t<11.85){ const p0=pose(0)
      if(t<11.45){sc=1+eiE(zi)*2.2; y=113-eiE(zi)*220}
      else {const e=eoE(zo); sc=lerp(3.2,1,e); y=lerp(-107,113,e); x=lerp(540,p0.x,e); ry=lerp(0,p0.ry,e)} }
    let si=-1; for(let i=0;i<4;i++) if(t>=SEG[i]-.1) si=i
    if(t>=11.85&&t<16.4){ const p=pose(si); x=p.x; ry=p.ry
      for(let i=1;i<4;i++){ if(t>=SEG[i]-.25&&t<SEG[i]+.3){const e=eio(P(t,SEG[i]-.25,SEG[i]+.3)),a=pose(i-1),b=pose(i);x=lerp(a.x,b.x,e);ry=lerp(a.ry,b.ry,e)+Math.sin(e*Math.PI)*(b.ry>a.ry?40:-40);y=113-Math.sin(e*Math.PI)*25}} }
    if(t>=16.4){ const e=eio(P(t,16.4,16.85)), a=pose(3); x=lerp(a.x,540,e); ry=lerp(a.ry,0,e)+Math.sin(t*.8)*4*e }
    // exit to CTA
    const ex=P(t,18.5,19.0); if(ex>0){ y=113+eiE(ex)*1100; rz=ex*-12; ry+=ex*30 }
    { const cz = t<11.0 ? 1.1 : (t>=16.4 ? lerp(1,1.1,eio(P(t,16.4,16.85))) : 1); if(!(t>=11.0&&t<11.85)) sc*=cz; else if(t<11.45) sc*=1.1 }
