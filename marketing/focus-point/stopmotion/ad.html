<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Focus Point — stop-motion ad</title>
<style>
@font-face { font-family: 'Alexandria'; src: url('../assets/alexandria-arabic-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
@font-face { font-family: 'Alexandria'; src: url('../assets/alexandria-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Poppins'; src: url('../assets/poppins-800.woff2') format('woff2'); font-weight: 800; }
@font-face { font-family: 'Poppins'; src: url('../assets/poppins-600.woff2') format('woff2'); font-weight: 600; }
:root { --wine: #7b1e2e; --wine-d: #5e1522; --ink: #1b1b1f; --paper: #ffffff; --shadow: rgba(30, 20, 25, 0.28); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f4f3; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: url('assets/desk.png') center / cover; font-family: 'Alexandria', sans-serif; color: var(--ink); }
#light { position: absolute; inset: 0; z-index: 900; pointer-events: none; background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%); opacity: 0; }

.pc { position: absolute; left: 0; top: 0; will-change: transform; transform-origin: center; }
/* contact shadow: pieces lie on the desk, lit from the top left */
.p-print, .p-switch, .p-clock, .p-phone, .p-tag, .p-logo { filter: drop-shadow(10px 14px 10px var(--shadow)) drop-shadow(2px 3px 2px rgba(0,0,0,0.12)); }

/* printed photo */
.print { background: var(--paper); padding: 22px 22px 70px; }
.print img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tape { position: absolute; width: 170px; height: 48px; background: rgba(123, 30, 46, 0.78); opacity: 0;
  clip-path: polygon(2% 8%, 98% 0, 100% 92%, 0 100%); }
.tape.tl { top: -18px; right: -40px; transform: rotate(38deg); }
.tape.br { bottom: -14px; left: -44px; transform: rotate(38deg); background: rgba(40, 40, 46, 0.72); }

/* paper captions: words cut out one by one */
.cap { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 16px; direction: rtl; line-height: 1.15; }
.cap .w { display: inline-block; padding: 0.08em 0.36em 0.42em; font-weight: 800; transform: rotate(var(--rot)); transform-origin: center; }  /* deep bottom: dots of ي / tails of ز ر never touch the cut edge */
.cap .w.white { background: var(--paper); color: var(--wine); filter: drop-shadow(6px 8px 6px var(--shadow)); }
.cap .w.wine { background: var(--wine); color: #fff; filter: drop-shadow(6px 8px 6px var(--shadow)); }
.cap .w.ink { background: transparent; color: var(--ink); filter: none; }
.cap .w.latin { font-family: 'Poppins', sans-serif; direction: ltr; }

/* FOCUS switch (the hall wall decal, in paper) */
.switch { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sw-word { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 170px; letter-spacing: -2px; line-height: 0.9; color: var(--ink);
  background: var(--paper); padding: 10px 28px 18px; transform: rotate(-2deg); }
.sw-track { position: relative; width: 420px; height: 150px; border-radius: 80px; background: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 46px;
  font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 54px; color: #fff; direction: ltr; }
/* the knob covers the state you are NOT in: OFF = knob on the left over «ON», ON = knob on the right over «OFF» */
.sw-knob { position: absolute; top: 18px; width: 114px; height: 114px; border-radius: 50%; background: #fff; --k: 0;
  left: calc(18px + (420px - 36px - 114px) * var(--k)); }
.is-on .sw-track { background: var(--wine); }

/* wooden frame (the "box") */
.frame { border: 22px solid #6b4a2f; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.18), 10px 14px 12px var(--shadow); }

/* paper clock */
.clock .c-face { position: relative; width: 460px; height: 460px; border-radius: 50%; background: var(--paper); border: 16px solid var(--wine); }
.clock .tick { position: absolute; left: 50%; top: 14px; width: 10px; height: 38px; margin-left: -5px; background: var(--ink); transform-origin: 5px 200px; transform: rotate(var(--a)); border-radius: 4px; }
.clock .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 8px; background: var(--ink); }
.clock .hand.h { width: 22px; height: 130px; margin-left: -11px; }
.clock .hand.m { width: 14px; height: 180px; margin-left: -7px; background: var(--wine); }
.clock .pin { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px; border-radius: 50%; background: var(--ink); }

/* paper phone */
.phone { position: relative; width: 470px; height: 960px; background: #1c1c20; border-radius: 64px; padding: 22px; }
.ph-screen { width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: #fff; }
.ph-screen img { width: 100%; display: block; }
.ph-notch { position: absolute; top: 34px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: #1c1c20; border-radius: 20px; }

/* tags / sticky notes */
.tag { background: var(--paper); padding: 26px 40px 30px; font-weight: 800; font-size: 58px; color: var(--ink); text-align: center; line-height: 1.25; }
.tag.wine { background: var(--wine); color: #fff; }
.tag.ink { background: var(--ink); color: #fff; }
.tag .small { display: block; font-size: 0.55em; font-weight: 600; opacity: 0.85; margin-top: 6px; }
.tag .ltr { direction: ltr; unicode-bidi: isolate; font-family: 'Poppins', sans-serif; }

/* end card (the wall sign in paper) */
.logo-card { width: 860px; height: 600px; background: var(--wine); display: flex; align-items: center; justify-content: center; }
.lg-row { display: flex; align-items: center; gap: 34px; direction: ltr; }
.lg-mark { width: 150px; height: 320px; overflow: visible; }
.lg-mark path { transition: none; transform-box: fill-box; transform-origin: center; }
.lg-words { display: flex; flex-direction: column; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 132px; line-height: 0.98; color: #f4efe9; letter-spacing: 2px; }
.lg-words span { display: block; }

/* paper map */
.map { position: relative; width: 900px; height: 760px; background: #eceef0; overflow: hidden; }
.map .st { position: absolute; background: #ffffff; }
.map .s1 { left: -40px; top: 300px; width: 1000px; height: 70px; transform: rotate(-8deg); }
.map .s2 { left: 380px; top: -60px; width: 64px; height: 900px; transform: rotate(6deg); }
.map .s3 { left: -40px; top: 600px; width: 1000px; height: 40px; transform: rotate(4deg); }
.map .s4 { left: 720px; top: -40px; width: 40px; height: 900px; transform: rotate(-3deg); }
.map .blk { position: absolute; left: 470px; top: 160px; width: 160px; height: 120px; background: var(--wine); opacity: 0.85; transform: rotate(-8deg); }
.map .mpin { position: absolute; left: 500px; top: 40px; width: 96px; height: 130px; background: var(--wine); clip-path: path('M48 130 C30 96 0 76 0 46 A48 46 0 1 1 96 46 C96 76 66 96 48 130 Z'); }
.map .mpin::after { content: ''; position: absolute; left: 30px; top: 28px; width: 36px; height: 36px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div id="stage"><div id="light"></div></div>
<script src="engine.js"></script>
<script src="parts.js"></script>
<script src="voice/timings.js" onerror="window.TIMINGS = null"></script>
<script src="scenes.js"></script>
</body>
</html>
