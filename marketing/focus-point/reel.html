<style>

:root{--cream:#f6f1ea;--paper:#fffdf9;--wine:#7b1e2e;--wine2:#5e1522;--plum:#402127;--gold:#a58d73;--gold2:#6f553c;--ink:#2a1b1e;--mute:#7a6a66;--wood:#d8c2a6;--wood2:#b89a7c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:A,'Noto Color Emoji',sans-serif;color:var(--ink);position:relative}
.abs{position:absolute}.full{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(10px)}
.m{display:block;overflow:hidden;padding:.08em 0 .18em}.mi{display:block;will-change:transform}
.h{font-weight:800;font-size:96px;line-height:1.22;letter-spacing:-.01em}
.sub{font-weight:500;font-size:40px;line-height:1.5;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:16px;padding:16px 30px;border-radius:999px;background:var(--paper);box-shadow:0 18px 40px rgba(64,33,39,.10),0 2px 0 rgba(255,255,255,.8) inset;font-weight:700;font-size:34px;color:var(--ink);white-space:nowrap}

/* words */
.w{position:absolute;left:90px;right:90px;text-align:center;font-weight:800;line-height:1.1;opacity:0;will-change:transform,filter}
/* corridor */
#cor{position:absolute;inset:0;perspective:900px;perspective-origin:50% 50%;overflow:hidden}

<script>
const $=id=>document.getElementById(id)
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), P=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,x)=>a+(b-a)*x
const eo3=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eoE=x=>x>=1?1:1-Math.pow(2,-10*x), eiE=x=>x<=0?0:Math.pow(2,10*x-10)
const eB=(x,s=1.7)=>{x=clamp(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}
const eEl=x=>{if(x<=0)return 0;if(x>=1)return 1;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1}
function rv(el,t,t0,dur=.5,tOut=null,od=.3){const x=P(t,t0,t0+dur);let y=(1-eoE(x))*118;let o=0;if(tOut!=null){o=P(t,tOut,tOut+od);y-=eio(o)*118}el.style.transform=`translateY(${y}%)`;el.style.opacity=(x<=0||o>=1)?0:1}
function pop(el,t,t0,dur=.45,tOut=null,od=.25,s=2){const x=P(t,t0,t0+dur),o=tOut!=null?P(t,tOut,tOut+od):0;el.style.opacity=(x<=0||o>=1)?0:clamp(x*4)*(1-o);el.style.transform=`translateY(${(1-eoE(x))*50-o*40}px) scale(${eB(x,s)})`}
// seeded pseudo-random (deterministic)
const rnd=(i,k=0)=>{const s=Math.sin(i*127.1+k*311.7)*43758.5453;return s-Math.floor(s)}

// ------- timeline from the voice-over -------
const T=window.TIMINGS||{duration:35,lines:[]}
const VO=1.4                                // the voice starts this many seconds into the video (silence pad in the mix)
const L=T.lines.map(l=>({...l,start:l.start+VO,end:l.end+VO,voice_end:(l.voice_end??l.end)+VO}))
const N=L.length
const LEAD=.28                              // visuals lead the voice a little
const S=L.map((l,i)=>({a:i==0?0:l.start-LEAD, b:i<N-1?L[i+1].start-LEAD:9e9, l}))
const END=(N?L[N-1].voice_end:T.duration+VO)+3.4   // hold the end card
window.DURATION=END
const txt=(i,k,d='')=>(L[i]&&L[i][k])||d

// ------- static builds -------
const ICONS={screen:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
 people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="3"/><path d="M15.5 20h6a5.5 5.5 0 0 0-4-5.3"/></svg>',
 snow:'<svg viewBox="0 0 24 24"><path d="M12 2v20M4 6l16 12M4 18L20 6M12 6l-3-2M12 6l3-2M12 18l-3 2M12 18l3 2"/></svg>',
 wifi:'<svg viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16.5a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>',
 coffee:'<svg viewBox="0 0 24 24"><path d="M3 9h13v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM16 10h2a3 3 0 0 1 0 6h-2M7 2v3M11 2v3"/></svg>',
 quiet:'<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM17 9l4 6M21 9l-4 6"/></svg>',
 door:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1.5"/><circle cx="15" cy="12" r="1" fill="currentColor"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>'}
const chip=(icon,label,extra='')=>`<span class="chip" ${extra}>${ICONS[icon]||''}<span>${label}</span></span>`

// hook words
const hookSrc=txt(0,'screen','ضجّة. تشتّت. ما بتنجز.')
let HOOK=hookSrc.split(/[.،!؟]+/).map(x=>x.trim()).filter(Boolean); if(HOOK.length<2) HOOK=hookSrc.split(/\s+/).filter(Boolean)
const hw=$('hookWords'); const HW=[]
HOOK.forEach((w,i)=>{const d=document.createElement('div');d.className='w';d.textContent=w;d.style.fontSize=(HOOK.length>3?104:(HOOK.some(w=>w.length>9)?124:150))+'px';hw.appendChild(d);HW.push(d)})
// corridor doors
const DOORS=[]; for(let i=0;i<9;i++) for(const side of [-1,1]){const d=document.createElement('div');d.className='door';const z=-500-i*440;d.style.transform=`translate3d(${side*436-150}px,-250px,${z}px) rotateY(90deg)`;
  const k=document.createElement('div');k.className='knob';k.style.left=side>0?'22px':'auto';k.style.right=side>0?'auto':'22px';d.appendChild(k);$('doors').appendChild(d)
  const lamp=document.createElement('div');lamp.className='lamp';lamp.style.transform=`translate3d(-80px,-750px,${z}px) rotateX(90deg)`;$('doors').appendChild(lamp)}
// clock ticks
for(let i=0;i<12;i++){const d=document.createElement('div');d.className='tick';d.style.transform=`rotate(${i*30}deg) translateY(-278px)`;if(i%3==0){d.style.height='44px';d.style.background='#9b8c80'};$('ticks').appendChild(d)}
// wordmark letters
'FOCUS POINT'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c==' '?' ':c;s.style.width=c==' '?'.45em':'auto';$('wm').appendChild(s)})
// feature chips (meeting)
const FCH=[['people','لعشرة أشخاص',120,1540],['screen','شاشة عرض',560,1540],['snow','تكييف',120,1660],['wifi','إنترنت',430,1660],['coffee','قهوة',720,1660]]
FCH.forEach(([ic,lab,x,y],i)=>{const d=document.createElement('div');d.className='fchip';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=chip(ic,lab);$('fchips').appendChild(d)})
const DCH=[['door','غرف خاصة'],['quiet','هدوء تام'],['coffee','قهوة']]

// text content from the script (screen text), with sensible fallbacks
$('corH').textContent=txt(1,'screen','ركنك الهادئ للإبداع')
$('corS').textContent='Focus Point · درعا'
$('doorH').textContent=txt(2,'screen','غرفتك… وهدوؤك')
$('cardH').textContent=txt(3,'screen','قاعة اجتماعات مجهّزة')
$('cardS').textContent='للفرق، للدورات، للّقاءات'
$('hoursH').textContent=txt(4,'screen','مفتوح كل يوم')

$('hoursS').textContent='يومياً'
$('mapTop').textContent=txt(5,'screen','وين؟')
$('mapH').textContent='درعا – شارع المجمع الحكومي'
$('mapS').textContent='بناء العايش'

// ------- render -------
function render(t){
  const B=[['g1',250,400,180,140,.05,.07],['g2',850,1500,160,200,.06,.05],['g3',900,500,200,160,.04,.06]]
  for(const [id,cx,cy,ax,ay,fx,fy] of B) $(id).style.transform=`translate(${cx+ax*Math.sin(t*fx*6.28+cx)-550}px,${cy+ay*Math.cos(t*fy*6.28+cy)-550}px)`
  const vis=['sHook','sCor','sDoor','sCard','sHours','sMap','sCta']
  const on=(id,a,b)=>{$(id).style.opacity=(t>=a&&t<b)?1:0}
  // scene windows (with small overlaps for transitions)
  const s=i=>S[i]||{a:9e9,b:9e9}
  on('sHook',0,s(1).a+.35); on('sCor',s(1).a,s(2).a+.5); on('sDoor',s(2).a,s(3).a+.4); on('sCard',s(3).a,s(4).a+.4); on('sHours',s(4).a,s(5).a+.4); on('sMap',s(5).a,s(6).a+.35); on('sCta',s(6).a,9e9)
  $('brand').style.opacity=clamp(P(t,s(2).a+.6,s(2).a+1.1)-P(t,s(6).a-.2,s(6).a+.1))
  $('wipe').style.opacity=0; $('flash').style.opacity=0

  // ---- S0 + hook (scene 0): dot pulses, words in chaos → focus
  if(t<s(1).a+.4){
    const a=0, b=s(1).a
    const d0=$('dot0'), r0=$('ring0')
    const pulse=P(t,.1,.7); d0.style.opacity=t<b-.5?clamp(pulse*4)*(1-P(t,1.1,1.4)):0; d0.style.transform=`scale(${eB(pulse,2.6)})`
    const rp=P(t,.35,1.3); r0.style.opacity=(1-rp)*.9*(t<b-.5?1:0); r0.style.transform=`scale(${1+rp*9})`
    // words
    const n=HW.length, t0=Math.max(1.0,L[0]?L[0].start-.15:1.0), per=Math.min(.42,(b-t0-1.2)/Math.max(1,n))
    const focusAt=t0+per*n+.35
    HW.forEach((el,i)=>{const ta=t0+i*per, x=P(t,ta,ta+.5)
      if(x<=0){el.style.opacity=0;return}
      const f=eio(P(t,focusAt,focusAt+.55))                        // chaos → aligned
      const cx=(rnd(i,1)-.5)*360, cy=(rnd(i,2)-.5)*520+(i-(n-1)/2)*40, rot=(rnd(i,3)-.5)*22
      const ax=0, ay=(i-(n-1)/2)*(HOOK.length>3?150:(HOOK.some(w=>w.length>9)?165:200))
      const ox=lerp(cx,ax,f), oy=lerp(cy,ay,f), r=lerp(rot,0,f), bl=lerp(7,0,f)*(1)+ (1-eoE(x))*14
      el.style.opacity=clamp(x*3)
      el.style.top=(960-el.offsetHeight/2)+'px'
      el.style.color=f>.5?'var(--ink)':`rgba(122,106,102,${.55+.45*f})`
      el.style.transform=`translate(${ox}px,${oy}px) rotate(${r}deg) scale(${lerp(.9,1,f)*lerp(1.3,1,eoE(x))})`
      el.style.filter=`blur(${bl}px)`
    })
    {const pd=P(t,b-.75,b-.45); const el=$('dot0'); if(pd>0&&t<b-.05){el.style.opacity=1; el.style.transform=`translate(${0}px,${(n-1)/2*(HOOK.length>3?150:(HOOK.some(w=>w.length>9)?165:200))+120}px) scale(${eB(pd,2.5)*1.3})`}}
    // leave: words scatter & fade, dot wipe
    const out=P(t,b-.45,b-.05); if(out>0){HW.forEach((el,i)=>{el.style.opacity=1-out;el.style.filter=`blur(${out*10}px)`;el.style.transform+=` translateY(${-out*60}px)`})}
    $('sHook').style.transform=`scale(${1+t*.012})`
  }
  // wipe between hook and corridor: burgundy circle grows then corridor revealed by inverse
  { const a=s(1).a; const g=P(t,a-.42,a-.02), r=P(t,a+.02,a+.5)
    if(g>0&&r<1){$('wipe').style.opacity=1; $('wipe').style.clipPath=`circle(${eio(g)*1400}px at 540px 960px)`}
    if(r>0&&r<1){const R=eio(r)*1400; $('wipe').style.opacity=1; $('wipe').style.clipPath='none'; $('wipe').style.webkitMaskImage=`radial-gradient(circle at 540px 960px, transparent ${R}px, #000 ${R+2}px)`} else $('wipe').style.webkitMaskImage='none'
    if(r>=1&&t>a){$('wipe').style.opacity=0}
  }
  // ---- corridor (scene 1)
  if(t>=s(1).a&&t<s(2).a+.5){
    const a=s(1).a, b=s(2).a, u=t-a, D=b-a
    const z=eio(P(u,0,D))*3850                                      // dolly forward
    const bob=Math.sin(u*2.1)*10, sway=Math.sin(u*1.3)*2
    $('cam').style.transform=`translate3d(0,${bob}px,${z}px) rotateY(${sway}deg)`
    // end logo gets closer: scale a bit as we approach
    rv($('corH'),t,a+.9,.5,b-.3,.3); rv($('corS'),t,a+1.1,.5,b-.28,.3)
    $('sCor').style.transform=`scale(${1+P(t,b-.5,b+.3)*.25})`
    $('sCor').style.filter=`blur(${P(t,b-.1,b+.3)*8}px)`
  } else {$('sCor').style.filter='none'}
  // ---- door (scene 2)
  if(t>=s(2).a&&t<s(3).a+.4){
    const a=s(2).a, b=s(3).a, u=t-a
    const openX=eio(P(u,.5,1.5)); $('bd').style.transform=`rotateY(${openX*-108}deg)`
    $('bd').style.boxShadow=`${-openX*60}px 40px 80px rgba(64,33,39,.25)`; $('spill').style.opacity=Math.sin(openX*Math.PI)*.8
    const push=eio(P(u,1.3,2.7)); const sc=lerp(1,3.6,push)
    $('doorGroup').style.transform=`scale(${sc})`
    $('doorGroup').style.transformOrigin=`540px ${1040-push*60}px`
    // photo ken burns inside
    $('bdimg').style.transform=`translate(-50%,-50%) scale(${1.08+Math.sin(u*.3)*.02+push*.08}) translate(${-push*20}px,${push*10}px)`
    $('bdphoto').style.boxShadow=`inset 0 0 0 ${lerp(0,0,push)}px #fff`
    // caption after push
    const cap=$('doorCap'); cap.style.opacity=push>.8?1:0
    rv($('doorH'),t,a+2.6,.5,b-.3,.3)
    ;[...$('doorChips').children].forEach((el,i)=>pop(el,t,a+2.95+i*.14,.45,b-.3,.25,2.2))
    // scene opacity in
    $('sDoor').style.transform=`scale(${lerp(1.15,1,eoE(P(u,0,.6)))})`
    const o=P(t,b-.25,b+.25); $('flash').style.opacity=o>0?Math.sin(o*Math.PI)*.9:0
  }
  // ---- meeting card (scene 3)
  if(t>=s(3).a&&t<s(4).a+.4){
    const a=s(3).a, b=s(4).a, u=t-a
    const inx=eoE(P(u,0,.9)), outx=eiE(P(t,b-.35,b+.1))
    const rx=Math.sin(u*.9)*5, ry=Math.cos(u*.7)*7
    $('card').style.transform=`translateY(${(1-inx)*700-outx*900}px) rotateX(${rx+(1-inx)*20}deg) rotateY(${ry}deg) scale(${lerp(.9,1,inx)})`
    $('cardimg').style.transform=`translate(-50%,-50%) translate(${ry*6}px,${rx*5}px) scale(${1.08+u*.004})`
    rv($('cardH'),t,a+.35,.5,b-.3,.3); rv($('cardS'),t,a+.55,.5,b-.28,.3)
    ;[...$('fchips').children].forEach((el,i)=>{const d=1.0+i*.16; pop(el,t,a+d,.45,b-.35,.25,2.4)})
  }
  // ---- hours (scene 4)
  if(t>=s(4).a&&t<s(5).a+.4){
    const a=s(4).a, b=s(5).a, u=t-a, D=b-a
    const inx=eoE(P(u,0,.8)), outx=eiE(P(t,b-.35,b+.1))
    $('clock').style.transform=`translateY(${(1-inx)*300}px) scale(${lerp(.6,1,eB(P(u,0,.8),1.4))*(1-outx*.5)})`; $('clock').style.opacity=1-outx
    const sweep=eio(P(u,.9,Math.max(1.6,D-1.4)))
    const hours=lerp(9,23,sweep)                                     // 9:00 → 23:00
    $('hh').style.transform=`rotate(${(hours%12)*30}deg)`; $('mh').style.transform=`rotate(${(hours*60)%60*6}deg)`
    // sun → moon arc over the clock
    const ang=Math.PI*(1-sweep)                                      // left → right
    const sx=540+Math.cos(ang)*460-45, sy=860-Math.sin(ang)*330-45
    const night=P(sweep,.6,1)
    $('sun').style.left=sx+'px'; $('sun').style.top=sy+'px'; $('sun').style.opacity=clamp(P(u,.6,1.0))*(1-outx)
    $('sun').style.background=night>0?`radial-gradient(circle at ${lerp(50,32,night)}% 45%, transparent ${lerp(0,38,night)}%, ${night>.5?'#d9c9b4':'#e9b64a'} ${lerp(0,40,night)}%)`:'#e9b64a'
    $('sun').style.boxShadow=`0 0 60px rgba(233,182,74,${.55*(1-night)})`
    document.body.style.background=`linear-gradient(#f6f1ea, ${night>0?`rgb(${lerp(246,243,night)},${lerp(241,229,night)},${lerp(234,220,night)})`:'#f6f1ea'})`
    rv($('hoursH'),t,a+.3,.5,b-.3,.3); rv($('hoursBig'),t,a+1.0,.55,b-.3,.3); rv($('hoursS'),t,a+1.25,.5,b-.28,.3)
  } else document.body.style.background='var(--cream)'
  // ---- map (scene 5)
  if(t>=s(5).a&&t<s(6).a+.35){
    const a=s(5).a, b=s(6).a, u=t-a
    const draw=eio(P(u,0,1.3))
    ;[...$('streets').children].forEach((p,i)=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len*(1-eio(P(u,i*.08,1.0+i*.08)))})
    const m=$('mainst'), ml=m.getTotalLength(); m.style.strokeDasharray=ml; m.style.strokeDashoffset=ml*(1-eio(P(u,.5,1.6)))
    $('mainst2').style.opacity=.85*P(u,1.4,1.8)
    ;[...$('blocks').children].forEach((r,i)=>{const x=eB(P(u,.3+i*.1,.8+i*.1),2);r.style.transformOrigin='center';r.style.transformBox='fill-box';r.style.transform=`scale(${x})`})
    const drop=P(u,1.5,2.0), e=eB(drop,2.8)
    const pin=$('pin'); pin.style.opacity=drop>0?1:0; pin.style.transform=`translateY(${(1-eo3(drop))*-700}px) scale(${lerp(1.6,1,e)})`
    const rp=P(u,1.95,3.0); $('ripple').style.opacity=rp>0?(1-rp):0; $('ripple').style.transform=`scale(${1+rp*7})`
    const card=$('mapCard'); const cx=P(u,2.1,2.6); card.style.opacity=clamp(cx*3); card.style.transform=`translateY(${(1-eoE(cx))*80}px) scale(${eB(cx,1.8)})`
    rv($('mapTop'),t,a+.25,.5,b-.3,.3)
    $('sMap').style.transform=`scale(${1+u*.01})`
  }
  // wipe map → cta with the pin's colour
  { const a=s(6).a; const g=P(t,a-.38,a-.02), r=P(t,a+.02,a+.5)
    if(g>0&&r<1){$('wipe').style.opacity=1; $('wipe').style.clipPath=`circle(${eio(g)*1500}px at 540px 1000px)`}
    if(r>0&&r<1){const R=eio(r)*1500; $('wipe').style.opacity=1; $('wipe').style.clipPath='none'; $('wipe').style.webkitMaskImage=`radial-gradient(circle at 540px 1000px, transparent ${R}px, #000 ${R+2}px)`} else if(t>a) $('wipe').style.webkitMaskImage='none'
    if(r>=1&&t>a) $('wipe').style.opacity=0
  }
  // ---- CTA (scene 6)
  if(t>=s(6).a){
    const a=s(6).a, u=t-a
    const lx=P(u,.1,.9); $('ctaLogo').style.opacity=clamp(lx*4); $('ctaLogo').style.transform=`scale(${eEl(lx)}) rotate(${(1-eoE(lx))*-25}deg)`
    ;[...$('wm').children].forEach((sp,i)=>{if(sp.id)return;const x=P(u,.5+i*.05,.9+i*.05);sp.style.opacity=x;sp.style.transform=`translateY(${(1-eoE(x))*60}px)`})
    rv($('ctaTag'),t,a+1.1,.5); rv($('ctaH'),t,a+1.5,.5)
    const cx=P(u,2.0,2.5); $('ctaCall').style.opacity=clamp(cx*3); $('ctaCall').style.transform=`scale(${eB(cx,2.2)})`
    const ix=P(u,2.35,2.8); $('ctaIg').style.opacity=clamp(ix*3); $('ctaIg').style.transform=`translateY(${(1-eoE(ix))*40}px)`
    rv($('ctaS'),t,a+2.7,.5)
    $('shine').style.left=lerp(-60,160,eio(P(u,3.2,4.0)))+'%'
    const pul=u>3.4?1+Math.sin((u-3.4)*Math.PI*2)*.025*Math.exp(-(u-3.4)*1.3):1; $('ctaCall').style.transform+=` scale(${pul})`
  }
  return true
}
window.render=render; render(0)
</script></body></html>
