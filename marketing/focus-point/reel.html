<script>
const $=id=>document.getElementById(id)
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), P=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,x)=>a+(b-a)*x
const eo3=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eoE=x=>x>=1?1:1-Math.pow(2,-10*x), eiE=x=>x<=0?0:Math.pow(2,10*x-10)
const eB=(x,s=1.7)=>{x=clamp(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)}
const eEl=x=>{if(x<=0)return 0;if(x>=1)return 1;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1}
function rv(el,t,t0,dur=.5,tOut=null,od=.3){const x=P(t,t0,t0+dur);let y=(1-eoE(x))*118;let o=0;if(tOut!=null){o=P(t,tOut,tOut+od);y-=eio(o)*118}el.style.transform=`translateY(${y}%)`;el.style.opacity=(x<=0||o>=1)?0:1}
function pop(el,t,t0,dur=.45,tOut=null,od=.25,s=2){const x=P(t,t0,t0+dur),o=tOut!=null?P(t,tOut,tOut+od):0;el.style.opacity=(x<=0||o>=1)?0:clamp(x*4)*(1-o);el.style.transform=`translateY(${(1-eoE(x))*50-o*40}px) scale(${eB(x,s)})`}
const rnd=(i,k=0)=>{const s=Math.sin(i*127.1+k*311.7)*43758.5453;return s-Math.floor(s)}

// ------- timeline from the voice-over -------
const T=window.TIMINGS||{duration:35,lines:[]}
const VO=1.4                                   // the voice starts this many seconds into the video (silence pad in the mix)
const L=T.lines.map(l=>({...l,start:l.start+VO,end:l.end+VO,voice_end:(l.voice_end??l.end)+VO,pauses:(l.pauses||[]).map(([a,b])=>[a+VO,b+VO])}))
const N=L.length
const LEAD=.28                                 // visuals lead the voice a little
const S=L.map((l,i)=>({a:i==0?0:l.start-LEAD, b:i<N-1?L[i+1].start-LEAD:9e9, l}))
const END=(N?L[N-1].voice_end:T.duration+VO)+3.4
window.DURATION=END
const strip=x=>String(x).replace(/[\u064B-\u0652\u0670\u0640]/g,'')   // no tashkeel on screen
const txt=(i,k,d='')=>strip((L[i]&&L[i][k])||d)
const s=i=>S[i]||{a:9e9,b:9e9}

// ------- static builds -------
const ICONS={screen:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
 people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="3"/><path d="M15.5 20h6a5.5 5.5 0 0 0-4-5.3"/></svg>',
 snow:'<svg viewBox="0 0 24 24"><path d="M12 2v20M4 6l16 12M4 18L20 6M12 6l-3-2M12 6l3-2M12 18l-3 2M12 18l3 2"/></svg>',
 wifi:'<svg viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16.5a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>',
 coffee:'<svg viewBox="0 0 24 24"><path d="M3 9h13v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM16 10h2a3 3 0 0 1 0 6h-2M7 2v3M11 2v3"/></svg>',
 quiet:'<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM17 9l4 6M21 9l-4 6"/></svg>',
 door:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1.5"/><circle cx="15" cy="12" r="1" fill="currentColor"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'}
const chip=(icon,label)=>`<span class="chip">${ICONS[icon]||''}<span>${label}</span></span>`

// hook phrases
const hookSrc=txt(1,'screen','تِقعُد... أو تِنجِز؟')
let HOOK=hookSrc.split(/[.،!؟]+/).map(x=>x.trim()).filter(Boolean); if(HOOK.length<2) HOOK=hookSrc.split(/\s+/).filter(Boolean)
const HW=[]; HOOK.forEach((w,i)=>{const d=document.createElement('div');d.className='w';
  if(i==HOOK.length-1){const ws=w.split(' ');d.innerHTML=ws.slice(0,-1).join(' ')+(ws.length>1?' ':'')+`<span style="color:var(--wine)">${ws[ws.length-1]}${/[؟?]$/.test(hookSrc.trim())?'؟':''}</span>`} else d.textContent=w
  d.style.fontSize=(HOOK.length>3?104:(HOOK.some(x=>x.length>9)?124:150))+'px';$('hookWords').appendChild(d);HW.push(d)})
const HGAP=HOOK.length>3?150:(HOOK.some(x=>x.length>9)?165:200)
// where: sound waves
for(let i=0;i<6;i++){const d=document.createElement('div');d.className='wave';$('waves').appendChild(d)}
// corridor doors
for(let i=0;i<9;i++) for(const side of [-1,1]){const d=document.createElement('div');d.className='door';const z=-500-i*440;d.style.transform=`translate3d(${side*428-150}px,-250px,${z}px) rotateY(90deg)`;
  const k=document.createElement('div');k.className='knob';k.style.left=side>0?'22px':'auto';k.style.right=side>0?'auto':'22px';d.appendChild(k);$('doors').appendChild(d)
  const lamp=document.createElement('div');lamp.className='lamp';lamp.style.transform=`translate3d(-70px,-749px,${z}px) rotateX(90deg)`;$('doors').appendChild(lamp)}
// clock ticks
for(let i=0;i<12;i++){const d=document.createElement('div');d.className='tick';d.style.transform=`rotate(${i*30}deg) translateY(-278px)`;if(i%3==0){d.style.height='44px';d.style.background='#9b8c80'};$('ticks').appendChild(d)}
// wordmark letters
'FOCUS POINT'.split('').forEach(c=>{const sp=document.createElement('span');sp.textContent=c==' '?' ':c;sp.style.width=c==' '?'.45em':'auto';$('wm').appendChild(sp)})
// chips
const DCH=[['door','غرف خاصة'],['people','قاعة لعشرة'],['screen','شاشة عرض'],['wifi','إنترنت']]
DCH.forEach(([ic,lab])=>{const d=document.createElement('div');d.className='fchip';d.style.position='relative';d.innerHTML=chip(ic,lab);$('doorChips').appendChild(d)})
const FCH=[['sun','ضوء طبيعي',110,1490],['snow','تكييف',600,1490],['coffee','قهوتك جنبك',110,1595],['quiet','هدوء تام',600,1595]]
FCH.forEach(([ic,lab,x,y])=>{const d=document.createElement('div');d.className='fchip';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=chip(ic,lab);$('fchips').appendChild(d)})

// texts (on-screen text comes from the script; the rest are brand facts)
$('in1').textContent=strip((txt(0,'screen','المشروع الأول من نوعه بدرعا')).replace(/\s*بدرعا\.?$/,''))
$('in2').textContent='بدرعا'
$('whereH').textContent=txt(2,'screen','وين بتشتغل؟')
$('corH').textContent=txt(3,'screen','مساحتك وركنك الهادئ للإبداع')
$('corS').textContent='Focus Point · درعا'
$('doorH').textContent=txt(4,'screen','غرف خاصة · قاعة اجتماعات')
$('cardH').textContent=txt(5,'screen','هدوء تام · إضاءة طبيعية')
$('hoursH').textContent='كل يوم'
$('hoursBig').innerHTML='من 9 صباحاً<br>حتى 11 مساءً'
$('mapH').textContent='درعا'
$('mapS').textContent='شارع المجمع الحكومي'
$('mapC').textContent='بناء العايش'
$('ctaTag').textContent='مساحتك وركنك الهادئ للإبداع'
$('ctaH').textContent='احجز ركنك هسا'
$('ctaS').textContent='للحجز والاستفسار · يومياً 9 ص – 11 م · درعا'

// ------- render -------
function render(t){
  const B=[['g1',250,400,180,140,.05,.07],['g2',850,1500,160,200,.06,.05],['g3',900,500,200,160,.04,.06]]
  for(const [id,cx,cy,ax,ay,fx,fy] of B) $(id).style.transform=`translate(${cx+ax*Math.sin(t*fx*6.28+cx)-550}px,${cy+ay*Math.cos(t*fy*6.28+cy)-550}px)`
  const on=(id,a,b)=>{$(id).style.opacity=(t>=a&&t<b)?1:0}
  on('sIntro',0,s(1).a+.3); on('sHook',s(1).a,s(2).a+.3); on('sWhere',s(2).a,s(3).a+.35); on('sCor',s(3).a,s(4).a+.5); on('sDoor',s(4).a,s(5).a+.4); on('sCard',s(5).a,s(6).a+.4); on('sTime',s(6).a,s(7).a+.35); on('sCta',s(7).a,9e9)
  $('brand').style.opacity=clamp(P(t,s(4).a+.6,s(4).a+1.1)-P(t,s(7).a-.2,s(7).a+.1))
  $('wipe').style.opacity=0; $('flash').style.opacity=0

  // ---- 0 hook: the point pulses, phrases in chaos → focus
  // ---- intro: the point pulses, "the first of its kind in Daraa"
  if(t<s(1).a+.35){
    const b=s(1).a, d0=$('dot0'), r0=$('ring0')
    const pulse=P(t,.1,.7); d0.style.opacity=clamp(pulse*4)*(1-P(t,1.0,1.3)); d0.style.transform=`scale(${eB(pulse,2.6)})`
    const rp=P(t,.35,1.3); r0.style.opacity=(1-rp)*.9; r0.style.transform=`scale(${1+rp*9})`
    const t0=Math.max(1.1,L[0]?L[0].start-.2:1.1)
    rv($('in1'),t,t0,.55,b-.4,.3); rv($('in2'),t,t0+.35,.55,b-.38,.3)
    const ul=P(t,t0+.9,t0+1.3); $('inUl').style.transform=`scaleX(${eoE(ul)*(1-eio(P(t,b-.4,b-.1)))})`
    $('sIntro').style.transform=`scale(${1+t*.01})`
  }
  if(t>=s(1).a&&t<s(2).a+.35){
    const b=s(2).a
    const n=HW.length, t0=Math.max(s(1).a+.25,L[1]?L[1].start-.15:s(1).a+.25), per=Math.min(.6,Math.max(.3,(b-t0-1.2)/Math.max(1,n)))
    const focusAt=t0+per*n+.3
    HW.forEach((el,i)=>{const ta=t0+i*per, x=P(t,ta,ta+.5)
      if(x<=0){el.style.opacity=0;return}
      const f=eio(P(t,focusAt,focusAt+.55))
      const cx=(rnd(i,1)-.5)*360, cy=(rnd(i,2)-.5)*520+(i-(n-1)/2)*40, rot=(rnd(i,3)-.5)*22
      const ay=(i-(n-1)/2)*HGAP
      const ox=lerp(cx,0,f), oy=lerp(cy,ay,f), r=lerp(rot,0,f), bl=lerp(7,0,f)+(1-eoE(x))*14
      el.style.opacity=clamp(x*3)
      el.style.top=(960-el.offsetHeight/2)+'px'
      el.style.color=f>.5?'var(--ink)':`rgba(122,106,102,${.55+.45*f})`
      el.style.transform=`translate(${ox}px,${oy}px) rotate(${r}deg) scale(${lerp(.9,1,f)*lerp(1.3,1,eoE(x))})`
      el.style.filter=`blur(${bl}px)`
    })
    const out=P(t,b-.4,b); if(out>0){HW.forEach(el=>{el.style.opacity=1-out;el.style.filter=`blur(${out*10}px)`;el.style.transform+=` translateY(${-out*60}px)`})}
    $('sHook').style.transform=`scale(${1+t*.012})`
  }
  // ---- 1 where?: two noisy places shake, then everything freezes into a big "where?"
  if(t>=s(2).a&&t<s(3).a+.35){
    const a=s(2).a, b=s(3).a, u=t-a, D=b-a
    const qAt=Math.max(1.6,D*.58)
    rv($('whereH'),t,a+.1,.5,a+qAt-.1,.25)
    ;[$('n0'),$('n1')].forEach((el,i)=>{const x=P(u,.35+i*.25,.85+i*.25), fz=P(u,qAt-.3,qAt)
      const sh=(1-fz)*clamp(x)*(1+u*.3); const jx=(rnd(Math.floor(t*30)+i*7,1)-.5)*14*sh, jy=(rnd(Math.floor(t*30)+i*13,2)-.5)*14*sh, jr=(rnd(Math.floor(t*30)+i*3,3)-.5)*3*sh
      el.style.opacity=clamp(x*3)*(1-P(u,qAt+.05,qAt+.4))
      el.style.transform=`translate(${jx}px,${jy}px) rotate(${(i?6:-6)+jr}deg) scale(${eB(x,1.8)*(1-P(u,qAt+.05,qAt+.4)*.2)})`
      el.style.filter=`blur(${P(u,qAt-.05,qAt+.3)*10}px)`
    })
    ;[...$('waves').children].forEach((w,i)=>{const src=i<3?[290,860]:[790,1140]; const p=((u*1.1)+i/3)%1; const vis=u>.9&&u<qAt-.1
      w.style.opacity=vis?(1-p)*.8:0; const r=40+p*260; w.style.left=(src[0]-r/2)+'px'; w.style.top=(src[1]-r/2)+'px'; w.style.width=w.style.height=r+'px'})
    const q=P(u,qAt,qAt+.4); const el=$('whereQ'); el.style.opacity=clamp(q*4); el.style.transform=`scale(${lerp(2.2,1,eoE(q))})`; el.style.filter=`blur(${(1-eoE(q))*16}px)`
    const o=P(t,b-.45,b-.05); if(o>0){el.style.opacity=1-o; el.style.transform=`scale(${1+o*.4})`}
  }
  // wipe where → corridor (burgundy point grows, then opens like an iris on the corridor)
  { const a=s(3).a; const g=P(t,a-.42,a-.02), r=P(t,a+.02,a+.5)
    if(g>0&&r<=0){$('wipe').style.opacity=1; $('wipe').style.webkitMaskImage='none'; $('wipe').style.clipPath=`circle(${eio(g)*1400}px at 540px 960px)`}
    if(r>0&&r<1){const R=eio(r)*1400; $('wipe').style.opacity=1; $('wipe').style.clipPath='none'; $('wipe').style.webkitMaskImage=`radial-gradient(circle at 540px 960px, transparent ${R}px, #000 ${R+2}px)`}
  }
  // ---- 2 corridor
  if(t>=s(3).a&&t<s(4).a+.5){
    const a=s(3).a, b=s(4).a, u=t-a, D=b-a
    const z=eio(P(u,0,D))*3850
    const bob=Math.sin(u*2.1)*10, sway=Math.sin(u*1.3)*2
    $('cam').style.transform=`translate3d(0,${bob}px,${z}px) rotateY(${sway}deg)`
    rv($('corH'),t,a+.9,.5,b-.3,.3); rv($('corS'),t,a+1.1,.5,b-.28,.3)
    $('sCor').style.transform=`scale(${1+P(t,b-.5,b+.3)*.25})`
    $('sCor').style.filter=`blur(${P(t,b-.1,b+.3)*8}px)`
  } else $('sCor').style.filter='none'
  // ---- 3 door → photo
  if(t>=s(4).a&&t<s(5).a+.4){
    const a=s(4).a, b=s(5).a, u=t-a
    const openX=eio(P(u,.5,1.5)); $('bd').style.transform=`rotateY(${openX*-108}deg)`
    $('bd').style.boxShadow=`${-openX*60}px 40px 80px rgba(64,33,39,.25)`; $('spill').style.opacity=Math.sin(openX*Math.PI)*.8
    const push=eio(P(u,1.3,2.7)); const sc=lerp(1,2.1,push)
    $('doorGroup').style.transform=`scale(${sc})`; $('doorGroup').style.transformOrigin=`540px ${1040-push*60}px`
    $('bdimg').style.transform=`scale(${1.04+push*.06})`
    const fullx=P(push,.55,1); $('doorFull').style.opacity=fullx; $('doorGroup').style.opacity=1-eio(fullx); $('doorFullImg').style.transform=`scale(${lerp(1.12,1.0,eoE(P(u,2.2,6.5)))})`
    $('doorCap').style.opacity=push>.8?1:0
    rv($('doorH'),t,a+2.55,.5,b-.3,.3)
    ;[...$('doorChips').children].forEach((el,i)=>pop(el,t,a+2.9+i*.14,.45,b-.3,.25,2.2))
    $('sDoor').style.transform=`scale(${lerp(1.15,1,eoE(P(u,0,.6)))})`
    const o=P(t,b-.25,b+.25); $('flash').style.opacity=o>0?Math.sin(o*Math.PI)*.9:0
  }
  // ---- 4 meeting card
  if(t>=s(5).a&&t<s(6).a+.4){
    const a=s(5).a, b=s(6).a, u=t-a
    const inx=eoE(P(u,0,.9)), outx=eiE(P(t,b-.35,b+.1))
    const rx=Math.sin(u*.9)*5, ry=Math.cos(u*.7)*7
    $('card').style.transform=`translateY(${(1-inx)*700-outx*900}px) rotateX(${rx+(1-inx)*20}deg) rotateY(${ry}deg) scale(${lerp(.9,1,inx)})`
    $('cardimg').style.transform=`translate(${ry*3}px,${rx*2.5}px) scale(${1+u*.003})`
    rv($('cardH'),t,a+.35,.5,b-.3,.3)
    ;[...$('fchips').children].forEach((el,i)=>pop(el,t,a+1.0+i*.16,.45,b-.35,.25,2.4))
  }
  // ---- 5 hours → map (one voice line: "every day 9–11 ... street, building")
  if(t>=s(6).a&&t<s(7).a+.35){
    const a=s(6).a, b=s(7).a, u=t-a, D=b-a
    const ps=(L[6]&&L[6].pauses&&L[6].pauses.length)?[...L[6].pauses].sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0]:null   // the longest pause = the "..." before the address
    const M=ps?Math.max(a+2.2,Math.min(b-2.0,(ps[0]+ps[1])/2-.1)):a+D*.52       // cut to the map here
    const m=M-a
    // clock part
    const inx=eoE(P(u,0,.8)), outx=eiE(P(u,m-.35,m+.05))
    $('clock').style.transform=`translateY(${(1-inx)*300+outx*60}px) scale(${lerp(.6,1,eB(P(u,0,.8),1.4))*(1-outx)})`; $('clock').style.opacity=1-outx
    const sweep=eio(P(u,.8,Math.max(1.5,m-.6)))
    const hours=lerp(9,23,sweep)
    $('hh').style.transform=`rotate(${(hours%12)*30}deg)`; $('mh').style.transform=`rotate(${(hours*60)%60*6}deg)`
    const ang=Math.PI*(1-sweep), night=P(sweep,.6,1)
    $('sun').style.left=(540+Math.cos(ang)*460-45)+'px'; $('sun').style.top=(900-Math.sin(ang)*330-45)+'px'; $('sun').style.opacity=clamp(P(u,.5,.9))*(1-outx)
    $('sun').style.background=night>0?`radial-gradient(circle at ${lerp(50,32,night)}% 45%, transparent ${lerp(0,38,night)}%, ${night>.5?'#d9c9b4':'#e9b64a'} ${lerp(0,40,night)}%)`:'#e9b64a'
    $('sun').style.boxShadow=`0 0 60px rgba(233,182,74,${.55*(1-night)})`
    document.body.style.background=`linear-gradient(#f6f1ea, rgb(${lerp(246,243,night*(1-outx))},${lerp(241,229,night*(1-outx))},${lerp(234,220,night*(1-outx))}))`
    rv($('hoursH'),t,a+.25,.5,M-.4,.3); rv($('hoursBig'),t,a+.9,.55,M-.4,.3)
    // map part
    const v=t-M
    $('map').style.opacity=clamp(P(v,-.1,.4))
    ;[...$('streets').children].forEach((p,i)=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len*(1-eio(P(v,i*.08,.9+i*.08)))})
    const ms=$('mainst'), ml=ms.getTotalLength(); ms.style.strokeDasharray=ml; ms.style.strokeDashoffset=ml*(1-eio(P(v,.3,1.3)))
    $('mainst2').style.opacity=.85*P(v,1.1,1.5)
    ;[...$('blocks').children].forEach((r,i)=>{const x=eB(P(v,.2+i*.08,.7+i*.08),2);r.style.transformOrigin='center';r.style.transformBox='fill-box';r.style.transform=`scale(${x})`})
    const drop=P(v,.9,1.4), e=eB(drop,2.8)
    $('pin').style.opacity=drop>0?1:0; $('pin').style.transform=`translateY(${(1-eo3(drop))*-700}px) scale(${lerp(1.6,1,e)})`
    const rp=P(v,1.35,2.4); $('ripple').style.opacity=rp>0?(1-rp):0; $('ripple').style.transform=`scale(${1+rp*7})`
    const cx=P(v,1.45,1.95); $('mapCard').style.opacity=clamp(cx*3); $('mapCard').style.transform=`translateY(${(1-eoE(cx))*80}px) scale(${eB(cx,1.8)})`
    $('sTime').style.transform=`scale(${1+u*.006})`
  } else document.body.style.background='var(--cream)'
  // wipe map → cta (the pin's colour)
  { const a=s(7).a; const g=P(t,a-.38,a-.02), r=P(t,a+.02,a+.5)
    if(g>0&&r<=0){$('wipe').style.opacity=1; $('wipe').style.webkitMaskImage='none'; $('wipe').style.clipPath=`circle(${eio(g)*1500}px at 540px 1000px)`}
    if(r>0&&r<1){const R=eio(r)*1500; $('wipe').style.opacity=1; $('wipe').style.clipPath='none'; $('wipe').style.webkitMaskImage=`radial-gradient(circle at 540px 1000px, transparent ${R}px, #000 ${R+2}px)`}
  }
  // ---- 6 CTA
  if(t>=s(7).a){
    const u=t-s(7).a
    const lx=P(u,.1,.9); $('ctaLogo').style.opacity=clamp(lx*4); $('ctaLogo').style.transform=`scale(${eEl(lx)}) rotate(${(1-eoE(lx))*-25}deg)`
    ;[...$('wm').children].forEach((sp,i)=>{if(sp.id)return;const x=P(u,.5+i*.05,.9+i*.05);sp.style.opacity=x;sp.style.transform=`translateY(${(1-eoE(x))*60}px)`})
    rv($('ctaTag'),t,s(7).a+1.1,.5); rv($('ctaH'),t,s(7).a+1.5,.5)
    const cx=P(u,2.0,2.5); $('ctaCall').style.opacity=clamp(cx*3); $('ctaCall').style.transform=`scale(${eB(cx,2.2)})`
    const ix=P(u,2.35,2.8); $('ctaIg').style.opacity=clamp(ix*3); $('ctaIg').style.transform=`translateY(${(1-eoE(ix))*40}px)`
    rv($('ctaS'),t,s(7).a+2.7,.5)
    $('shine').style.left=lerp(-60,160,eio(P(u,3.2,4.0)))+'%'
    const pul=u>3.4?1+Math.sin((u-3.4)*Math.PI*2)*.025*Math.exp(-(u-3.4)*1.3):1; $('ctaCall').style.transform+=` scale(${pul})`
  }
  return true
}
window.render=render; render(0)
</script></body></html>
