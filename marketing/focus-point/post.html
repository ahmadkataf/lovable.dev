<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(assets/alexandria-arabic-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+0660-0669}
@font-face{font-family:A;src:url(assets/alexandria-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:P;src:url(assets/poppins-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:P;src:url(assets/poppins-800.woff2) format('woff2');font-weight:800}
:root{--cream:#f6f1ea;--paper:#fffdf9;--wine:#7b1e2e;--plum:#402127;--gold:#a58d73;--ink:#2a1b1e;--mute:#7a6a66}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--cream)}
body{font-family:A,sans-serif;color:var(--ink);position:relative}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(14px)}
.brand{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center}
.brand .in{display:flex;align-items:center;gap:14px;direction:ltr;padding:12px 26px 12px 14px;border-radius:999px;background:rgba(255,253,249,.9);box-shadow:0 10px 30px rgba(64,33,39,.08)}
.brand img{width:44px;height:44px;border-radius:50%}
.brand span{font-family:P;font-weight:700;font-size:28px;color:var(--plum);letter-spacing:.02em}
.kicker{position:absolute;top:150px;left:0;right:0;text-align:center;font-weight:600;font-size:30px;color:var(--wine);letter-spacing:.01em}
.kicker span{display:inline-block;padding:10px 26px;border-radius:999px;border:2px solid rgba(123,30,46,.35);background:rgba(255,253,249,.7)}
h1{position:absolute;top:215px;left:70px;right:70px;text-align:center;font-weight:800;font-size:76px;line-height:1.25;color:var(--ink)}
h1 b{color:var(--wine)}
/* door frame with the photo */
.door{position:absolute;left:150px;top:470px;width:780px;height:560px;border-radius:300px 300px 36px 36px;background:var(--wine);padding:18px;box-shadow:0 50px 100px rgba(64,33,39,.22)}
.door .fr{width:100%;height:100%;border-radius:282px 282px 22px 22px;border:12px solid #fbf8f4;overflow:hidden;position:relative;background:#000}
.door img{width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.tag{position:absolute;right:92px;top:430px;background:var(--plum);color:#fff;font-weight:800;font-size:30px;padding:16px 30px;border-radius:999px;box-shadow:0 18px 40px rgba(64,33,39,.25);transform:rotate(6deg)}
.tag2{position:absolute;left:92px;top:960px;background:var(--paper);color:var(--ink);font-weight:800;font-size:28px;padding:16px 28px;border-radius:999px;box-shadow:0 18px 40px rgba(64,33,39,.16);transform:rotate(-5deg)}
.tag2 i{font-style:normal;color:var(--wine)}
.chips{position:absolute;top:1068px;left:60px;right:60px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:var(--paper);box-shadow:0 12px 28px rgba(64,33,39,.08);font-weight:700;font-size:27px;white-space:nowrap}
.chip svg{width:30px;height:30px;stroke:var(--wine);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.foot{position:absolute;left:60px;right:60px;top:1200px;height:100px;border-radius:30px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 34px;box-shadow:0 24px 60px rgba(64,33,39,.25)}
.foot .ph{display:flex;align-items:center;gap:14px;font-family:P;font-weight:800;font-size:40px;direction:ltr;letter-spacing:.04em}
.foot .ph svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.foot .ad{text-align:right;font-weight:600;font-size:24px;line-height:1.35;color:rgba(255,255,255,.92)}
.foot .ad b{font-weight:800;color:#f1d9b5}
.ig{position:absolute;top:1312px;left:0;right:0;text-align:center;font-family:P;font-weight:700;font-size:20px;color:var(--mute);direction:ltr;letter-spacing:.04em}
</style></head><body>
<div class="blob" style="left:-300px;top:-200px;background:radial-gradient(closest-side,rgba(255,214,190,.6),rgba(255,214,190,0))"></div>
<div class="blob" style="left:500px;top:700px;background:radial-gradient(closest-side,rgba(221,205,180,.5),rgba(221,205,180,0))"></div>
<div class="blob" style="left:400px;top:-300px;background:radial-gradient(closest-side,rgba(243,196,196,.4),rgba(243,196,196,0))"></div>

<div class="brand"><div class="in"><img src="assets/logo.svg"><span>FOCUS POINT</span></div></div>
<div class="kicker"><span>المشروع الأول من نوعه بدرعا</span></div>
<h1>مو بس مكان تقعد فيه…<br><b>مكان تنجز فيه.</b></h1>

<div class="door"><div class="fr"><img src="assets/room-b.jpg"></div></div>
<div class="tag">غرف خاصة · قاعة اجتماعات</div>
<div class="tag2">يومياً <i>9 ص – 11 م</i></div>

<div class="chips">
  <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zM17 9l4 6M21 9l-4 6"/></svg>هدوء تام</span>
  <span class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>إضاءة طبيعية</span>
  <span class="chip"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>شاشة عرض</span>
  <span class="chip"><svg viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16.5a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>إنترنت</span>
  <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 2v20M4 6l16 12M4 18L20 6"/></svg>تكييف</span>
  <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 9h13v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM16 10h2a3 3 0 0 1 0 6h-2M7 2v3M11 2v3"/></svg>قهوة</span>
</div>

<div class="foot">
  <div class="ad"><b>درعا</b> – شارع المجمع الحكومي<br>بناء العايش · للحجز والاستفسار</div>
  <div class="ph"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>0985258963</div>
</div>
<div class="ig">@its_focus_point</div>
</body></html>
