const eo=x=>1-Math.pow(1-clamp(x,0,1),3), ei=x=>Math.pow(clamp(x,0,1),3), eio=x=>{x=clamp(x,0,1);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

// text: fades up with a small rise; size px; opts: cls, x,y (center), p progress 0..1, align

function typed(key,x,y,{size=72,cls='h amber',p=1,text,cursor=true}={}){const s=text!==undefined?text:T[LANG][key];const n=Math.floor(clamp(p,0,1)*s.length);if(n<=0&&!cursor)return;
  const d=el(`<div class="t ${cls}"></div>`);d.style.fontSize=size+'px';d.style.left=x+'px';d.style.top=y+'px';d.style.transform='translate(-50%,-50%)';

  txt('exT',960,160,{size:40,cls:'b dim chip',p:ap(u,0,.6)*keep});

  if(u>k(.03)){for(let i=0;i<40;i++){const px=240+hash('mx'+i)*1440,py=260+hash('my'+i)*700;const p=ap(u,k(.03)+hash('md'+i)*k(.08),.6);const tw=.5+.5*Math.sin(FRAME/6+i);el(`<div style="position:absolute;left:${px}px;top:${py}px;width:6px;height:6px;border-radius:50%;background:#38d9c0;opacity:${(p*.25*tw).toFixed(2)}"></div>`);}}
  const cards=[[k(.12),'c1','c1b','phone'],[k(.3),'c2','c2b','scooter'],[k(.48),'c3','c3b','stamp']];
  cards.forEach(([s,a,b,ic],i)=>{if(u<s||keep<=0)return;const p=ap(u,s,.8)*keep;const x=RTL()?1480-i*520:440+i*520;const y=460;
    el(`<div class="card" style="left:${x-260}px;top:${y-210}px;opacity:${p};transform:translateY(${(1-p)*30}px)"></div>`);
    txt(null,x,y-150,{size:40,cls:'h amber',text:(i+1)+'',p});txt(a,x,y-90,{size:48,cls:'h white',p});icon(ic,x,y+20,ap(u,s+.2,1),{size:150,op:keep});txt(b,x,y+150,{size:30,cls:'b dim',p:ap(u,s+.4,.6)*keep});
    if(i===1&&u>s+.8){txt('fee',x+(RTL()?-150:150),y-150,{size:34,cls:'h amber',p:ap(u,s+.8,.5)*keep});}
  });
  // chain of receipts
  if(u>k(.62)&&keep>0){const n=5;for(let i=0;i<n;i++){const s=k(.62)+i*k(.035);if(u<s)continue;const p=ap(u,s,.6)*keep;const x=RTL()?1560-i*300:360+i*300;const y=840;
      el(`<div style="position:absolute;left:${x-110}px;top:${y-60}px;width:220px;height:120px;border-radius:12px;border:2px solid #38d9c0;background:#0b0f15;opacity:${p};box-shadow:0 0 24px rgba(56,217,192,.35)"></div>`);
      txt(null,x,y-22,{size:24,cls:'mono teal',text:'#'+(hash('h'+i).toString(16).slice(2,10)),p});txt(null,x,y+22,{size:22,cls:'mono dim',text:'← '+(hash('h'+(i-1)).toString(16).slice(2,8)),p:i?p:0});
      if(i<n-1&&u>s+.3)line(RTL()?x-110:x+110,y,RTL()?x-190:x+190,y,ap(u,s+.3,.4),{col:'#38d9c0',w:4});}
    txt('chainT',960,720,{size:38,cls:'b white',p:ap(u,k(.62),.8)*keep});
    if(u>k(.76))txt('like',RTL()?1300:620,960,{size:44,cls:'h teal',p:ap(u,k(.76),.6)*keep});
    if(u>k(.8))txt('without',RTL()?620:1300,960,{size:44,cls:'h red',p:ap(u,k(.8),.6)*keep});}
  if(u>k(.88)){const p=ap(u,k(.88),.8);el(`<div style="position:absolute;inset:0;background:rgba(5,7,10,${.82*p})"></div>`);txt('zero',960,470,{size:260,cls:'h amber mono',p});txt('forever',960,660,{size:48,cls:'b white',p:ap(u,k(.9),.7)});txt('flat',960,760,{size:40,cls:'b dim chip',p:ap(u,k(.93),.6)});}
};
S.why=(u,d)=>{const k=f=>d*f;const keep=1-ap(u,k(.64),.7);   // the three ingredients fade before the key line
  txt('whyT',960,180,{size:RTL()?90:100,cls:'h white',p:ap(u,0,.7)*keep});
  const items=[[k(.08),'i1','phone'],[k(.2),'i2','bolt'],[k(.34),'i3','gauge']];
  if(keep>0)items.forEach(([s,key,ic],i)=>{if(u<s)return;const p=ap(u,s,.8)*keep;const x=RTL()?1480-i*520:440+i*520;icon(ic,x,440,ap(u,s,.8),{size:170,col:i===2?'#ff5a5a':'#ffb347',op:keep});txt(key,x,600,{size:40,cls:'b white',p});
    if(i===2&&u>s+.6){const g=ap(u,s+.6,1.4);const ang=-90+180*g;el(`<svg class="ic" style="left:${x-85}px;top:${440-85}px;opacity:${keep}" width="170" height="170" viewBox="0 0 120 120"><line x1="60" y1="90" x2="${60+40*Math.cos(ang*Math.PI/180)}" y2="${90+40*Math.sin(ang*Math.PI/180)}" stroke="#ff5a5a" stroke-width="5"/></svg>`);}});
  if(u>k(.52)&&keep>0)txt('laws',960,720,{size:40,cls:'b dim',p:ap(u,k(.52),.8)*keep});
  if(u>k(.66)){const p=ap(u,k(.66),.8);el(`<div style="position:absolute;inset:0;background:rgba(5,7,10,${.85*p})"></div>`);txt('key',960,440,{size:RTL()?80:84,cls:'h amber',p});}
  if(u>k(.78)){const p=ap(u,k(.78),.8);icon('scooter',960,650,p,{size:160,col:'#9aa4b2',w:4});txt('key2',960,820,{size:RTL()?60:64,cls:'h white',p});}
};
S.end=(u,d)=>{const k=f=>d*f;
  const gone=ap(u,k(.72),.6);   // the first half fades out before the closing lines
  if(u>k(.04)&&gone<1){const p=ap(u,k(.04),1)*(1-gone);txt('name',960,300,{size:RTL()?120:110,cls:'h white',p,op:.95});el(`<div style="position:absolute;left:860px;top:380px;width:200px;height:2px;background:#ffb347;opacity:${p}"></div>`);}
  if(u>k(.3)&&gone<1){const q=typed('q2',960,560,{size:RTL()?84:90,p:lin(u,k(.3),k(.5)),cls:'h amber'});if(q)q.style.opacity=(1-gone).toFixed(3);}
  if(u>k(.58)&&gone<1)txt('face',960,690,{size:52,cls:'b dim',p:ap(u,k(.58),.8)*(1-gone)});
  if(u>k(.72)){const p=ap(u,k(.72),.9);el(`<div style="position:absolute;inset:0;background:rgba(5,7,10,${.9*p})"></div>`);txt('fin1',960,440,{size:RTL()?80:84,cls:'h white',p});txt('fin2',960,640,{size:RTL()?96:100,cls:'h red',p:ap(u,k(.8),.9)});}
  if(u>k(.95)){const p=ap(u,k(.95),1);el(`<div style="position:absolute;inset:0;background:#000;opacity:${p}"></div>`);}
};
function render(t){
  FRAME=Math.floor(t*FPS);layer.innerHTML='';
  document.getElementById('gt').setAttribute('seed',String((FRAME%7)+1));
  if(!TL)return;
  let sc=TL.scenes.find(s=>t>=s.start&&t<s.end);if(!sc)sc=TL.scenes[TL.scenes.length-1];
  const u=t-sc.start,d=sc.end-sc.start;
  // slow camera push-in per scene and a drifting light leak
  const z=1+.05*lin(u,0,d);document.getElementById('cam').style.transform=`scale(${z.toFixed(4)})`;
  const lk=document.getElementById('leak');lk.style.transform=`translate(${(300+500*Math.sin(t/9)).toFixed(0)}px,${(-500+300*Math.cos(t/11)).toFixed(0)}px)`;
  // scene fade in/out
  S[sc.id](u,d);
  const fade=Math.min(lin(u,0,.5),1-lin(u,d-.5,d));if(fade<1)el(`<div style="position:absolute;inset:0;background:#05070a;opacity:${(1-fade).toFixed(3)}"></div>`);
  if(t<.6)el(`<div style="position:absolute;inset:0;background:#000;opacity:${(1-t/.6).toFixed(3)}"></div>`);
}
window.render=render;window.setLang=setLang;window.setTimeline=setTimeline;
