:root{--ink:#0B0B0F;--navy:#07111F;--paper:#F4F1E8;--screen:#F6F8FB;--white:#FFFFFF;--amber:#FFB400;--amberink:#8F5E00;--mint:#19F0A0;--mintink:#0B8F5C;--graphite:#1A1A22;--red:#FF3B4E;--muted:#8A8F9C;--field:#0B0B0F}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:var(--field)}
body{position:relative;font-family:Plex,Tajawal,sans-serif;color:#fff}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}

.beat{position:absolute;left:0;top:0;width:1080px;height:1920px}
.abs{position:absolute}
.hide{display:none!important}

.hl{position:absolute;left:120px;width:840px;text-align:center;font-family:Kufi;font-weight:800;color:#fff;line-height:1.2;white-space:nowrap}

#meas{position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;font-family:Kufi;font-weight:800}

.nv{display:inline-block;white-space:nowrap}
.cur{font-family:Tajawal;font-weight:800;font-size:.34em;margin:0 .15em}

.mono{font-family:Mono;font-weight:600;direction:ltr;unicode-bidi:isolate;display:inline-block}

.rsh{position:absolute;left:4%;right:4%;top:30px;bottom:-30px;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.65),transparent 70%)}

.rc .row{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;padding:12px 0;font-weight:500}
.rc .row .num{font-size:28px;font-weight:700}
.rc .tot{display:block;border-top:3px dotted var(--ink);padding-top:12px;margin-top:6px}
.rc .tot .lab{display:block;font-family:Kufi;font-weight:800;font-size:22px;color:#5E6470;line-height:1.3}

.rc .tot .num{font-size:78px;line-height:1.05}
.rc .ft{position:absolute;left:24px;right:24px;bottom:26px;font-size:24px;color:#5E6470;text-align:center;font-weight:500}
.xrow,.slab{position:absolute;height:56px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-family:Plex;font-weight:700;font-size:26px;color:var(--amberink);background:var(--paper)}

.slot{position:absolute;height:56px;background:linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.06));box-sizing:border-box}

.pill .num{font-size:44px;color:var(--mint)}

#preload{position:absolute;left:-9999px;top:0;visibility:hidden}
#dbg{pointer-events:none}
#dbg div{position:absolute;border:2px dashed rgba(255,0,255,.7)}

window.getHits = () => HITS; window.getGroups = () => GROUPS; window.getT = () => T;

/* ================= render ================= */
function drift(el, t, p1, p2, amp = 3, rot = .6, extra = '') { tf(el, `${extra} translateY(${(amp * Math.sin(2 * Math.PI * t / p1)).toFixed(2)}px) rotate(${(rot * Math.sin(2 * Math.PI * t / p2)).toFixed(3)}deg)`); }

function render(t) {

    } else {

      stampIn(E.st1, t, H.tap1); stampIn(E.st2, t, H.tap2);
      const sq = (t0) => t >= t0 ? (0.92 + 0.08 * back(P(t, t0, .25))) : 1; tf(E.c1, `scale(${sq(H.tap1).toFixed(3)})`); tf(E.c2, `scale(${sq(H.tap2).toFixed(3)})`);

    vis(E.rs20, l2 && !l3); vis(E.rs30, l3); vis(E.rs40, l4);
