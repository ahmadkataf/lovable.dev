*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#d9c39b}
body{position:relative;font-family:Cairo,Fredoka,sans-serif;color:#243b4a}
#set{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 20%, rgba(255,250,235,.55), rgba(255,250,235,0) 60%),
  linear-gradient(180deg,#e6d4ae 0%,#dcc69c 64%,#b8945f 64.5%,#a8844f 100%)}
#grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,rgba(0,0,0,0) 55%,rgba(60,30,0,.35) 100%);pointer-events:none}
#stage{position:absolute;inset:0}
#stage svg{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.pc{filter:drop-shadow(3px 5px 0 rgba(60,30,0,.22))}
.lbl{position:absolute;white-space:nowrap;display:inline-block;padding:10px 34px;line-height:1.15;
  background:#fbf6ea;color:#243b4a;box-shadow:4px 6px 0 rgba(60,30,0,.25);
  clip-path:polygon(0 6%,3% 0,97% 2%,100% 8%,99% 94%,96% 100%,4% 98%,0 92%);
  font-weight:900;will-change:transform;transform-origin:50% 50%}
.lbl.red{background:#e5493a;color:#fff8ee}
.lbl.teal{background:#2a9d8f;color:#fff8ee}
.lbl.yel{background:#f4c542;color:#3a2a00}
.lbl.navy{background:#264653;color:#fff8ee}
.lbl.purple{background:#6a4c93;color:#fff8ee}
.lbl.ghost{background:transparent;box-shadow:none;clip-path:none;text-shadow:5px 6px 0 rgba(60,30,0,.28)}
.ar .lbl{font-family:Lalezar,Cairo,sans-serif;font-weight:400;letter-spacing:0}
.en .lbl{font-family:Bangers,Fredoka,sans-serif;font-weight:400;letter-spacing:1px}
.en .lbl.body{font-family:Fredoka,sans-serif;font-weight:700;letter-spacing:0}
.ar .lbl.body{font-family:Cairo,sans-serif;font-weight:900}
.hide{display:none}
#rec{position:absolute;left:40px;top:170px;display:flex;align-items:center;gap:14px;font:700 34px Fredoka,Cairo;color:#fff8ee;background:#243b4a;padding:8px 22px;box-shadow:3px 4px 0 rgba(0,0,0,.25)}
#rec i{width:22px;height:22px;border-radius:50%;background:#e5493a;display:inline-block}
.strike{position:absolute;height:14px;background:#e5493a;transform-origin:0 50%;box-shadow:2px 3px 0 rgba(60,30,0,.25)}
</style></head>

let LANG='ar', TL=null, FPS=12;
const world=document.getElementById('world'), textLayer=document.getElementById('text');
function setLang(l){LANG=l;document.body.className=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.getElementById('shopSign').textContent=T[l].shop;document.getElementById('shopSign').setAttribute('font-family',l==='ar'?'Cairo':'Fredoka');document.getElementById('bankSign').textContent=T[l].bankw;}

// ---------- helpers ----------
let FRAME=0;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}
function jit(id,amp=1.6,rot=0.6){const a=hash(id+'x'+FRAME),b=hash(id+'y'+FRAME),c=hash(id+'r'+FRAME);return {dx:(a-.5)*2*amp,dy:(b-.5)*2*amp,rot:(c-.5)*2*rot};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function steps(x,n){return Math.round(clamp(x,0,1)*n)/n;}             // quantize 0..1 into n steps
function pop(u,s,d=0.5){const x=clamp((u-s)/d,0,1);if(x<=0)return 0;const k=Math.round(x*4);return [0,.55,.85,1.14,1][k];} // paper pop-in: 4 steps with overshoot
function lin(u,s,e,a=0,b=1){return a+(b-a)*clamp((u-s)/(e-s),0,1);}
function at(u,s){return u>=s;}
// svg element factory (fresh each frame; cheap enough at this size)
const NS='http://www.w3.org/2000/svg';
function use(sym,x,y,{s=1,rot=0,id=sym,j=true,cls='pc',w,h,flip=false,op=1}={}){
  if(s<=0)return null;const e=document.createElementNS(NS,'use');e.setAttribute('href','#'+sym);
  const sz={coin:60,btc:60,plate:120,owner:160,driver:260,customer:140,octo:320,shop:420,bank:320,scissors:240,phone:200,receipt:160,lock:100,link:80,contract:260,yt:240,hand:160,bit:12}[sym]||100;
  const hh={coin:60,btc:60,plate:80,owner:300,driver:230,customer:300,octo:320,shop:360,bank:260,scissors:120,phone:380,receipt:220,lock:130,link:40,contract:340,yt:340,hand:240,bit:12}[sym]||100;
  const W=w||sz,H=h||hh;const jj=j?jit(id):{dx:0,dy:0,rot:0};
  e.setAttribute('width',W);e.setAttribute('height',H);e.setAttribute('x',-W/2);e.setAttribute('y',-H/2);
  e.setAttribute('transform',`translate(${x+jj.dx} ${y+jj.dy}) rotate(${rot+jj.rot}) scale(${flip?-s:s} ${s})`);
  if(cls)e.setAttribute('class',cls);if(op<1)e.setAttribute('opacity',op);world.appendChild(e);return e;}
function shape(html){const g=document.createElementNS(NS,'g');g.innerHTML=html;world.appendChild(g);return g;}
function label(key,x,y,{size=64,cls='',s=1,rot=0,id=key,text,w,dir}={}){
  if(s<=0)return;const d=document.createElement('div');d.className='lbl '+cls;d.textContent=text!==undefined?text:T[LANG][key];if(dir)d.dir=dir;
  d.style.fontSize=size+'px';if(w)d.style.minWidth=w+'px';const jj=jit(id,1.2,.5);
  d.style.left=x+'px';d.style.top=y+'px';d.style.transform=`translate(-50%,-50%) translate(${jj.dx}px,${jj.dy}px) rotate(${rot+jj.rot}deg) scale(${s})`;
  textLayer.appendChild(d);return d;}
function strike(x,y,w,u,s,rot=-6){const k=steps(clamp((u-s)/.35,0,1),3);if(k<=0)return;const d=document.createElement('div');d.className='strike';d.style.left=x+'px';d.style.top=y+'px';d.style.width=(w*k)+'px';d.style.transform=`rotate(${rot}deg)`;textLayer.appendChild(d);}
function setOp(root,sel,v){const n=root&&root.querySelector?null:null;}
// presenter puppet with mouth flap from VO envelope
function env(t){if(!TL)return 0;const i=Math.floor(t*FPS);return TL.env[i]||0;}
function puppet(x,y,t,{s=1,mood='talk',point=false,rot=0,id='yt'}={}){
  const e=use('yt',x,y,{s,rot,id});if(!e)return;
  // mouth / brows / pupils via CSS vars on a cloned symbol are hard with <use>; draw overlays instead
  const v=env(t);const open=v>.45?1:v>.2?.55:.12;const jj=jit(id);
  const g=document.createElementNS(NS,'g');
  const cx=x+jj.dx,cy=y+jj.dy;
  const mw=mood==='shock'?22:18, mh=mood==='shock'?(18+10*open):(4+16*open);
  g.innerHTML=`<g transform="translate(${cx} ${cy}) rotate(${rot+jj.rot}) scale(${s})">
    <ellipse cx="0" cy="-58" rx="${mw}" ry="${mh}" fill="#7a3b2a"/>${mh>10?'<ellipse cx="0" cy="-50" rx="10" ry="5" fill="#e07070"/>':''}
    ${mood==='shock'?'<path d="M-44 -140 q18 -14 36 -2 M8 -142 q18 -12 36 2" fill="none" stroke="#243b4a" stroke-width="6" stroke-linecap="round"/><circle cx="-24" cy="-104" r="16" fill="#fff"/><circle cx="24" cy="-104" r="16" fill="#fff"/><circle cx="-24" cy="-104" r="6" fill="#243b4a"/><circle cx="24" cy="-104" r="6" fill="#243b4a"/>':''}
    ${mood==='happy'?'<path d="M-40 -134 q16 -8 32 0 M8 -134 q16 -8 32 0" fill="none" stroke="#243b4a" stroke-width="6" stroke-linecap="round"/>':''}
    ${point?'<rect x="70" y="-70" width="110" height="28" rx="14" fill="#f1c9a5" stroke="#b07a4f" stroke-width="3" transform="rotate(-30 70 -56)"/>':''}
  </g>`;world.appendChild(g);}
function coins(x,y,n,u,s0,{dx=0,dy=-16,id='coins',sc=1}={}){for(let i=0;i<n;i++){const p=pop(u,s0+i*.08,.3);if(p>0)use('coin',x+dx*i,y+dy*i,{s:p*sc,id:id+i});}}
function confetti(x,y,u,s0,n=26,id='cf'){const k=clamp((u-s0)/1.2,0,1);if(k<=0)return;const cols=['#e5493a','#f4c542','#2a9d8f','#6a4c93','#fff8ee'];
  for(let i=0;i<n;i++){const a=hash(id+'a'+i)*6.283,r=hash(id+'r'+i)*260+80;const q=steps(k,8);const px=x+Math.cos(a)*r*q,py=y+Math.sin(a)*r*q+q*q*160;const g=document.createElementNS(NS,'g');g.innerHTML=`<rect x="-9" y="-6" width="18" height="12" fill="${cols[i%5]}" transform="translate(${px} ${py}) rotate(${(hash(id+'t'+i)*360+FRAME*25)|0})"/>`;world.appendChild(g);}}
function hand(x,y,u,s,e,from=[0,900]){ // animator's hand slides in from bottom and out again
  if(u<s||u>e)return;const k=u<(s+e)/2?steps((u-s)/((e-s)/2),4):1-steps((u-(s+e)/2)/((e-s)/2),4);
  use('hand',x+from[0]*(1-k),y+from[1]*(1-k),{s:2.1,rot:-20,id:'hand',cls:'pc'});}

S.reveal=(u,d,t)=>{const k=f=>d*f;

  }else{

// ---------- main ----------
function render(t){
  FRAME=Math.floor(t*FPS);
  world.innerHTML='';textLayer.innerHTML='';
  document.getElementById('rt').setAttribute('seed',String((FRAME%3)+1));
  document.getElementById('set').style.filter=`brightness(${(1+(hash('flick'+FRAME)-.5)*.04).toFixed(3)})`;
  if(!TL)return;
  let sc=TL.scenes.find(s=>t>=s.start&&t<s.end);if(!sc)sc=TL.scenes[TL.scenes.length-1];
  const u=t-sc.start,d=sc.end-sc.start;
  S[sc.id](u,d,t);
  hand(820,1700,u,0,.45,[0,700]);
}
window.render=render;window.setLang=setLang;window.setTimeline=setTimeline;
