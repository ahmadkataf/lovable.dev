// Maven Central is listed through both of its hosts on purpose: on some networks one of them answers 404/429
// intermittently, and Gradle moves on to the next repository when an artifact is missing from one.
pluginManagement { repositories { google(); mavenCentral(); maven { url 'https://repo1.maven.org/maven2' }; gradlePluginPortal() } }
dependencyResolutionManagement { repositories { google(); mavenCentral(); maven { url 'https://repo1.maven.org/maven2' } } }
rootProject.name = "FocusPoint"
include ':app'
