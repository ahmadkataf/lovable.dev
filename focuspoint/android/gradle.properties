org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The address of the deployed system (the Worker URL or your domain). Override: gradle -PtwaUrl=https://... assembleRelease
twaUrl=https://focuspoint.example
# Signing (release): gradle -PksFile=... -PksPass=... -PkeyAlias=... -PkeyPass=... ; or set the same names as environment variables FP_KS_FILE etc.

# retry transient download errors (flaky mirrors)
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1500
