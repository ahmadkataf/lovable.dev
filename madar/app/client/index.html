<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مَدار</title>
<meta name="description" content="مَدار — منظومة تعليمية رقمية تربط مديرية التربية والمدرسة والمعلّم والطالب ووليّ الأمر.">
<meta name="theme-color" content="#2a5bea">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مَدار">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" href="/fonts/plex-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/alexandria-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Critical CSS for the splash: paints with the system Arabic font as soon as the HTML arrives;
   React replaces #root's content when the bundle has loaded. */
html{background:#f3f7fd;-webkit-text-size-adjust:100%}
body{margin:0;background:#f3f7fd;color:#0e1a33;font-family:system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif;direction:rtl;text-align:right}
.splash,.splash h1,.splash p{font-family:system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,Arial,sans-serif}
.splash{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px 16px;background:linear-gradient(180deg,#f6f9ff 0%,#eef5fb 45%,#eaf5f2 100%)}
.splash-in{display:grid;justify-items:center;gap:8px}
.splash svg{width:92px;height:92px;display:block;filter:drop-shadow(0 18px 30px rgba(30,60,120,.18));margin-bottom:6px}
.splash h1{margin:0;font-size:2.1rem;line-height:1.5;font-weight:800;letter-spacing:-.01em}
.splash p{margin:0;color:#3f4d68;font-size:1.02rem;line-height:1.7;font-weight:600}
.splash .wait{animation:splash-pulse 1.6s ease-in-out infinite}
.splash .slow{opacity:0;color:#5f6c86;font-size:.92rem;font-weight:500;animation:splash-appear .6s ease 9s forwards}
@keyframes splash-pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes splash-appear{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.splash .wait{animation:none}}
</style>
</head>
<body>
<div id="root"><div class="splash" role="status" aria-live="polite"><div class="splash-in">
<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#f3f7fd"/><circle cx="32" cy="32" r="22" fill="none" stroke="#2a5bea" stroke-width="2.6" stroke-dasharray="4 5"/><circle cx="32" cy="32" r="12" fill="#2a5bea" opacity=".15"/><circle cx="32" cy="32" r="7" fill="#2a5bea"/><circle cx="32" cy="10" r="4.5" fill="#f0a020"/><circle cx="54" cy="32" r="3.8" fill="#14a3b4"/><circle cx="32" cy="54" r="3.8" fill="#e85d8d"/><circle cx="10" cy="32" r="3.8" fill="#7a5cff"/></svg>
<h1>مَدار</h1>
<p class="wait">جارٍ التحميل…</p>
<p class="slow">الاتصال بطيء، ولا يزال التحميل مستمرّاً</p>
</div></div></div>
<noscript>يحتاج تطبيق مَدار إلى تفعيل JavaScript في المتصفّح.</noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
