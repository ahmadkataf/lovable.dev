name = "madar-app"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
[assets]
directory = "../client/dist"
binding = "ASSETS"
run_worker_first = true
# The pilot database: a SQLite-backed Durable Object (see src/do.ts). Apply schema.sql and seed.sql with
# scripts/apply-sql.mjs after deploying; secrets: TOKEN_SECRET, ADMIN_KEY.
[[durable_objects.bindings]]
name = "MADAR_DO"
class_name = "MadarDB"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MadarDB"]
[[rules]]
type = "Text"
globs = ["**/*.sql"]

[triggers]
crons = ["0 3 * * *"]

[vars]
WEEKLY_CAP = "28"
APP_URL = "https://app.madar.raqeem.dev"
