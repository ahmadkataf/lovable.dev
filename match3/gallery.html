<!doctype html>
<!-- Dev-only art gallery (not part of the production build): npx vite --port 5181 --strictPort, then /gallery.html -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art gallery</title>
    <style>
      html, body { margin: 0; background: #14123a; color: #fff6dc; font: 500 13px/1.3 system-ui, sans-serif; }
      body { padding: 12px; }
      h2 { margin: 18px 0 8px; font-size: 15px; color: #f5c95a; }
      section { display: inline-block; vertical-align: top; padding: 10px; margin: 0 8px 12px 0; background: #1a1748; border-radius: 8px; }
      section.bare { padding: 0; background: none; border-radius: 0; }
      .row { display: flex; align-items: flex-end; flex-wrap: wrap; }
      .row > * { margin-right: 10px; margin-bottom: 8px; }
      .cap { font-size: 11px; color: #c9c2e6; margin: 2px 0 6px; }
      canvas, img { display: block; }
      .px { image-rendering: pixelated; }
      .grey { filter: grayscale(1); }
      .protan { filter: url(#protan); }
      .deutan { filter: url(#deutan); }
      .ui { background: #231f5c; padding: 8px; border-radius: 8px; }
      .gold { background: linear-gradient(#ffe7a3, #f5c95a); padding: 8px; border-radius: 8px; }
      .violet { background: #3a2a7a; padding: 8px; border-radius: 8px; }
      .icons { display: grid; grid-template-columns: repeat(12, auto); gap: 6px 10px; align-items: center; justify-items: center; }
      .icons .n { font-size: 9px; color: #c9c2e6; grid-column: span 1; }
      .cell { display: flex; flex-direction: column; align-items: center; }
      .cell span { font-size: 8px; color: #a9a2d0; margin-top: 2px; }
    </style>
  </head>
  <body>
    <!-- colour-vision simulation matrices (approximate) used by the gem check -->
    <svg width="0" height="0" style="position: absolute">
      <filter id="protan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.152 1.053 -0.205 0 0  0.115 0.786 0.099 0 0  -0.004 -0.048 1.052 0 0  0 0 0 1 0" />
      </filter>
      <filter id="deutan" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/art/gallery/main.ts"></script>
  </body>
</html>
