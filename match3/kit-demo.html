<!doctype html>
<!--
  Dev-only showcase of the UI kit (not part of the production build):
    npx vite --port 5183 --strictPort   →   http://127.0.0.1:5183/kit-demo.html
  Query: ?lang=ar (Arabic, RTL) · ?open=<scenario> (basic, confirm, medal, tall, stack, result, lose, shop, long, locked, toasts)
  Screenshots: node tools/kit-shots.cjs
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14123a" />
    <title>UI kit demo</title>
    <style>
      html,
      body {
        margin: 0;
        background: #14123a;
      }
      /* The showcase scrolls as a normal page (the game itself keeps #app fixed). */
      #app.k-app {
        position: relative;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
      #backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .demo {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 12px 48px;
      }
      .demo-section {
        box-sizing: border-box;
        margin: 0 0 14px;
        padding: 12px 12px 16px;
        border-radius: 16px;
        background: rgba(20, 18, 58, 0.72);
      }
      .demo-section h2 {
        margin: 0 0 10px;
        font-size: calc(var(--k-u) * 15);
        font-weight: 700;
        color: #c9c2e6;
        text-align: start;
      }
      .demo-cap {
        margin: 12px 0 6px;
        font-size: calc(var(--k-u) * 12.5);
        font-weight: 600;
        color: #a9a2d0;
        text-align: start;
      }
      .demo-flow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        margin: -5px;
      }
      .demo-flow > * {
        margin: 5px;
      }
      .demo-stack > * + * {
        margin-top: 10px;
      }
      .demo-gold {
        padding: 10px;
        border-radius: 12px;
        background: linear-gradient(#ffe7a3, #f5c95a);
      }
      .demo-narrow {
        max-width: 300px;
      }
      .demo-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="backdrop"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/ui/kit/demo.ts"></script>
  </body>
</html>
