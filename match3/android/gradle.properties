# ── Gradle ──
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false

# ── App identity and version ──
# Each value can be overridden without editing this file, in this order of precedence:
#   1. command line:          ./gradlew -PVERSION_CODE=7 -PVERSION_NAME=1.0.6 ...
#   2. environment variable:  VERSION_CODE=7 VERSION_NAME=1.0.6 ./gradlew ...
#   3. the defaults below
#
# APP_ID is the Play Store identity of the game and can never change after the first upload.
# (The Kotlin package / namespace stays com.zumurud.game whatever APP_ID is.)
APP_ID=com.zumurud.game
# Must grow with every upload to Google Play (max 2100000000).
VERSION_CODE=1
VERSION_NAME=1.0.0
# Google Play requires new apps and updates to target API 36 today (API 37 from August 2027).
# compileSdk is 37; targetSdk stays one release behind on purpose: every bundled SDK has had a
# full year of testing against API 36 behaviour.
TARGET_SDK=36
