# كراج الرضوان — puts the website and the sync server online on Cloudflare (Workers + D1).
# Runs when started by hand from the Actions tab, and whenever the app or the server changes (like deploy-server.yml).
# Needs only the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers + D1 Edit) and
# CLOUDFLARE_ACCOUNT_ID: the D1 database is created on the first run when wrangler.toml has no id yet.
name: Deploy AlRadwan Garage website
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths: ['alradwan/src/**', 'alradwan/public/**', 'alradwan/index.html', 'alradwan/package*.json', 'alradwan/server/**', '.github/workflows/alradwan-deploy.yml']
concurrency: alradwan-deploy
defaults:
  run:
    working-directory: alradwan
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # licensing (optional): the control panel key and the secret that signs activations
      ALRADWAN_ADMIN_KEY: ${{ secrets.ALRADWAN_ADMIN_KEY }}
      ALRADWAN_TOKEN_SECRET: ${{ secrets.ALRADWAN_TOKEN_SECRET }}
      # the server address the apps activate against (repository variable), e.g. https://alradwan.<name>.workers.dev
      ALRADWAN_API: ${{ vars.ALRADWAN_API }}
    steps:
      - name: Wait for the Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        working-directory: .
        run: echo "::warning::الموقع لم يُنشر بعد. أضف السرّين CLOUDFLARE_API_TOKEN وCLOUDFLARE_ACCOUNT_ID في Settings → Secrets and variables → Actions ثم شغّل هذا السير مرة أخرى. (Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, then run this workflow again.)"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22, cache: npm, cache-dependency-path: alradwan/package-lock.json }
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Find or create the database
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: alradwan/server
        run: |
          npm ci
          if grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID wrangler.toml; then
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "alradwan") | .uuid' | head -1)
            if [ -z "$ID" ]; then
              echo "Creating the D1 database alradwan…"
              npx wrangler d1 create alradwan >/dev/null
              ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "alradwan") | .uuid' | head -1)
            fi
            [ -n "$ID" ] || { echo "::error::Could not find or create the D1 database."; exit 1; }
            sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
            echo "Using D1 database $ID"
          fi
      - name: Create the tables and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: alradwan/server
        run: |
          npx wrangler d1 execute alradwan --remote --file=schema.sql
          if [ -n "$ALRADWAN_TOKEN_SECRET" ]; then printf '%s' "$ALRADWAN_TOKEN_SECRET" | npx wrangler secret put TOKEN_SECRET; fi
          if [ -n "$ALRADWAN_ADMIN_KEY" ]; then printf '%s' "$ALRADWAN_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY; fi
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "## الموقع" >> "$GITHUB_STEP_SUMMARY"
          echo "${URL:-(see the log above)}" >> "$GITHUB_STEP_SUMMARY"
          echo "site=$URL" >> "$GITHUB_OUTPUT"
