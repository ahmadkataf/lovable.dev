# كراج الرضوان — puts the website and the sync server online on Cloudflare (Workers + D1).
# Runs when started by hand from the Actions tab, and whenever the app changes on the main branch.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers + D1 Edit) and CLOUDFLARE_ACCOUNT_ID,
# and the D1 database id written into alradwan/server/wrangler.toml (see alradwan/README.md).
name: Deploy AlRadwan Garage website
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['alradwan/**', '.github/workflows/alradwan-deploy.yml']
concurrency: alradwan-deploy
defaults:
  run:
    working-directory: alradwan
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: alradwan/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Check the database id
        run: |
          if grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID server/wrangler.toml; then
            echo "::error::Create the D1 database first (npx wrangler d1 create alradwan) and put its id in alradwan/server/wrangler.toml"; exit 1; fi
      - name: Create the tables and deploy
        working-directory: alradwan/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler d1 execute alradwan --remote --file=schema.sql
          npx wrangler deploy
