# Builds Kaseb POS (pos/): the web app, the Windows installer and the Android APK (+ App Bundle).
# Start it from the Actions tab (Build Kaseb POS → Run workflow); the files appear under "Artifacts":
#   kaseb-web      pos/dist                       the plain web build (demo / browser use)
#   kaseb-windows  Kaseb-POS-Setup-<version>.exe  the Windows installer (NSIS, x64)
#   kaseb-android  Kaseb.apk (+ Kaseb.aab)       the Android app for direct install (+ Google Play bundle)
# Before the first run (see pos/README.md):
#   1. deploy the license server (pos/server/README.md)
#   2. set the repository variable KASEB_API to its address, e.g. https://kaseb-api.<name>.workers.dev
#      (the app is built with that address and with the server's public key, so licenses from any other server are refused)
# Android signing uses the upload key from the repository secrets (optional, but needed for Google Play and for the
# APK-signature allow-list in the codes page):
#   KASEB_KEYSTORE_BASE64    the release.keystore file, base64-encoded
#   KASEB_KEYSTORE_PASSWORD  its password
#   KASEB_KEY_ALIAS          the key alias inside it (kaseb for the key made by pos/scripts/build-apk.sh)
name: Build Kaseb POS
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users (e.g. 1.0.0)'
        default: '1.0.0'
        required: true
      version_code:
        description: 'Android version code (must grow with every Play upload); empty = the run number + 100'
        required: false
      api:
        description: 'License server address (used when the KASEB_API repository variable is not set)'
        default: 'https://kaseb-api.almutafawiqin.workers.dev'
        required: false

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - name: Install
        run: npm ci
      - name: Read the license server address and its public key
        env:
          KASEB_API: ${{ vars.KASEB_API || github.event.inputs.api }}
        run: |
          if [ -z "$KASEB_API" ]; then
            echo "::error::Set the repository variable KASEB_API to the server address (see pos/server/README.md)"
            exit 1
          fi
          API="${KASEB_API%/}"
          KEY=$(curl -fsSL "$API/api/public-key" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const k=JSON.parse(s).publicKey;if(!k||!/^[0-9a-f]{64}$/i.test(k)){console.error('no publicKey in the reply from '+process.argv[1]);process.exit(1)}console.log(k)})" "$API")
          echo "POS_API=$API" >> "$GITHUB_ENV"
          echo "POS_LICENSE_PUBLIC_KEY=$KEY" >> "$GITHUB_ENV"
          echo "POS_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Server: $API — public key ${KEY:0:12}…"
      - name: Set the version
        run: npm version --no-git-tag-version "${{ inputs.version_name }}"
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: kaseb-web
          path: pos/dist
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: web
    defaults:
      run:
        working-directory: pos
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: kaseb-web
          path: pos/dist
      - name: Set the version
        run: npm version --no-git-tag-version "${{ inputs.version_name }}"
      - name: Build the installer (electron-builder + fuses)
        run: npx electron-builder --win --x64 --config electron-builder.json
      - uses: actions/upload-artifact@v4
        with:
          name: kaseb-windows
          path: pos/release/*.exe
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-35
      - uses: actions/download-artifact@v4
        with:
          name: kaseb-web
          path: pos/dist
      - name: Get the icon tools
        run: pip install --quiet pillow
      - name: Get bundletool (for the Google Play bundle)
        continue-on-error: true
        run: curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
      - name: Get the signing key
        env:
          KS_B64: ${{ secrets.KASEB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          else echo "::warning::No KASEB_KEYSTORE_BASE64 secret: signing with a throwaway key (fine for testing, not for Google Play; its signature changes on every run)."; fi
      - name: Build the APK and the App Bundle
        env:
          BUNDLETOOL: ${{ runner.temp }}/bundletool.jar
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KASEB_KEYSTORE_PASSWORD || 'kasebpass' }}
          ANDROID_KEY_ALIAS: ${{ secrets.KASEB_KEY_ALIAS || 'kaseb' }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export VERSION_CODE="${VERSION_CODE_INPUT:-$((GITHUB_RUN_NUMBER + 100))}"
          chmod +x pos/scripts/build-apk.sh
          pos/scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kaseb-android
          path: |
            pos/android/build/*.apk
            pos/android/build/*.aab
          if-no-files-found: error
