# Publishes the Madar pitch site (madar/site) on Cloudflare: first at https://madar.<account>.workers.dev,
# then attached to https://madar.raqeem.dev (the raqeem.dev zone must be in the same Cloudflare account).
# Uses the same repository secrets as the Emar server: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runs whenever the site changes, or by hand from the Actions tab.
name: Deploy Madar site
on:
  workflow_dispatch:
  push:
    paths: ['madar/site/**', 'madar/wrangler.toml', '.github/workflows/deploy-madar.yml']
concurrency: deploy-madar
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: madar.raqeem.dev
      ZONE_NAME: raqeem.dev
    steps:
      - name: Wait for the Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, then run this workflow again."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22 }
      - name: Deploy the site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: madar
        run: |
          npx --yes wrangler@4 deploy
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
          echo "::notice::Site is live at https://madar.$SUB.workers.dev"
          echo "### Madar site" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://madar.$SUB.workers.dev" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the custom domain
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          ZONE=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const z=JSON.parse(s).result[0];console.log(z?z.id:'')})")
          if [ -z "$ZONE" ]; then
            echo "::warning::The zone $ZONE_NAME is not visible to this API token. Add the domain by hand: Cloudflare → Workers & Pages → madar → Settings → Domains & Routes → Add → Custom domain → $DOMAIN"
            exit 1
          fi
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -d "{\"hostname\":\"$DOMAIN\",\"service\":\"madar\",\"environment\":\"production\",\"zone_id\":\"$ZONE\"}" > /dev/null \
            || { echo "::warning::Could not attach $DOMAIN automatically (the token may lack DNS permissions). Add it by hand: Workers & Pages → madar → Settings → Domains & Routes → Add → Custom domain → $DOMAIN"; exit 1; }
          echo "::notice::Site is live at https://$DOMAIN"
          echo "- https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
