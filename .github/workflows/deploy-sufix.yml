# Puts the SUFIX site and API online on Cloudflare (Workers + D1). Free tier is enough.
# Runs by hand from the Actions tab, and whenever sufix/ changes.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with "Edit Cloudflare Workers" and "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
name: Deploy SUFIX
on:
  workflow_dispatch:
  push:
    paths: ['sufix/**', '.github/workflows/deploy-sufix.yml']
concurrency: deploy-sufix
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: sufix
    steps:
      - name: Wait for the Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, then run this workflow again."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22 }
      - name: Install and build the site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build
      - name: Create the database the first time, and use its id
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name==='sufix');console.log(d?d.uuid:'')})")
          if [ -z "$ID" ]; then npx wrangler d1 create sufix; ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).find(x=>x.name==='sufix').uuid)})"); fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
