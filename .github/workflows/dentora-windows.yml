# Dentora — Windows installer (Electron + electron-builder)
#
# بناء نسخة ويندوز من Dentora: برنامج التثبيت Dentora-Setup-<الإصدار>.exe والنسخة المحمولة Dentora-Portable-<الإصدار>.exe
#   • التشغيل يدوياً: تبويب Actions ← "Dentora Windows" ← Run workflow (يمكن كتابة رقم الإصدار مثل 1.2.0، أو تركه فارغاً لاستخدام رقم package.json).
#   • أو تلقائياً عند دفع وسم مثل dentora-v1.2.0  (git tag dentora-v1.2.0 && git push origin dentora-v1.2.0) — يُؤخذ الإصدار من الوسم.
#   • أين أجد الملفات؟ Actions ← اختر التشغيل ← أسفل الصفحة قسم Artifacts ← "Dentora-windows" (ملف zip يحوي ملفات ‎.exe).
#   • التوقيع الرقمي (مهم قبل البيع): Windows 11 الجديد يفعّل Smart App Control الذي يمنع برامج التثبيت غير الموقَّعة تماماً،
#     وفي غيره يُظهر SmartScreen تحذيراً. يوقّع هذا السير الملفات تلقائياً عند وجود الأسرار (التفاصيل في dental/docs/WINDOWS.md §7):
#       Azure Trusted Signing (الأسهل والأرخص): AZURE_TENANT_ID و AZURE_CLIENT_ID و AZURE_CLIENT_SECRET
#         و AZURE_TS_ENDPOINT و AZURE_TS_ACCOUNT و AZURE_TS_PROFILE و AZURE_TS_PUBLISHER (اسم الناشر كما في الشهادة)
#       أو شهادة بملف ‎.pfx (إن أعطاك المُصدِر ملفاً): CSC_LINK (base64) و CSC_KEY_PASSWORD
#
# Builds the Windows installer (NSIS, Dentora-Setup-<version>.exe) and the portable exe (Dentora-Portable-<version>.exe).
#   • Run it from Actions → "Dentora Windows" → Run workflow (optional version such as 1.2.0; empty = package.json version),
#     or push a tag like dentora-v1.2.0 (the version is taken from the tag).
#   • Where is the installer? Actions → open the run → "Artifacts" at the bottom → "Dentora-windows" (a zip with the .exe files).
#     Artifacts are kept for 90 days; download and keep the ones you ship.
#   • Code signing (needed to sell): Smart App Control, on by default on a clean Windows 11, blocks unsigned installers
#     outright; elsewhere SmartScreen warns. The build signs Dentora.exe, the installer, the uninstaller and the portable
#     exe, with a timestamp, when one of these sets of repository secrets exists (dental/docs/WINDOWS.md §7):
#       Azure Trusted Signing:  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration with the
#                               "Trusted Signing Certificate Profile Signer" role), AZURE_TS_ENDPOINT (e.g.
#                               https://weu.codesigning.azure.net), AZURE_TS_ACCOUNT, AZURE_TS_PROFILE, AZURE_TS_PUBLISHER
#                               (the certificate's subject CN, e.g. "Dentora Ltd")
#       a .pfx certificate:     CSC_LINK (base64 of the .pfx) and CSC_KEY_PASSWORD (only CAs that still issue exportable
#                               keys; OV/EV keys bought since June 2023 live on a token or a cloud HSM: see the docs)
#   • No GH_TOKEN is needed: nothing is published, the files are only uploaded as an artifact.
name: Dentora Windows

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (e.g. 1.2.0). Empty = the version in dental/package.json'
        required: false
        default: ''
  push:
    tags:
      - 'dentora-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dental
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dental/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('dental/package-lock.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        run: npm ci

      - name: Set the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          V="${INPUT_VERSION// /}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/dentora-v* ]]; then V="${GITHUB_REF#refs/tags/dentora-v}"; fi
          if [ -n "$V" ]; then
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::The version must look like 1.2.0 (got '$V')."; exit 1; }
            # only in this run's checkout: the web app (__APP_VERSION__), the exe and the file names all use it
            npm version "$V" --no-git-tag-version --allow-same-version >/dev/null
          fi
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Dentora $V"

      - name: Build the web app
        run: npm run build

      - name: Build the Windows installer and the portable exe
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TS_PUBLISHER: ${{ secrets.AZURE_TS_PUBLISHER }}
        run: |
          SIGN=()
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TS_ENDPOINT" ] && [ -n "$AZURE_TS_ACCOUNT" ] && [ -n "$AZURE_TS_PROFILE" ] && [ -n "$AZURE_TS_PUBLISHER" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            SIGN=(-c.win.azureSignOptions.endpoint="$AZURE_TS_ENDPOINT"
                  -c.win.azureSignOptions.codeSigningAccountName="$AZURE_TS_ACCOUNT"
                  -c.win.azureSignOptions.certificateProfileName="$AZURE_TS_PROFILE"
                  -c.win.azureSignOptions.publisherName="$AZURE_TS_PUBLISHER")
            echo "::notice::Signing with Azure Trusted Signing as \"$AZURE_TS_PUBLISHER\"."
          elif [ -n "$CSC_LINK" ]; then
            echo "::notice::Signing with the certificate in CSC_LINK."
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::No signing secrets: the installer is UNSIGNED. Smart App Control blocks it on a new Windows 11 PC and SmartScreen warns elsewhere. Do not ship it to clinics."
          fi
          npx electron-builder --win --publish never "${SIGN[@]}"

      # The installed app itself: Dentora.exe (with its Electron fuses and the embedded app.asar hash) must start and
      # load its page, must refuse a debugging port, and must refuse an app.asar changed after the build.
      - name: Check the packaged Dentora.exe (starts; refuses a debugging port and a modified app.asar)
        timeout-minutes: 6
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          started() { for _ in $(seq 1 "$2"); do grep -q "started v" "$1/logs/main.log" 2>/dev/null && return 0; sleep 1; done; return 1; }
          running() { tasklist //FI "IMAGENAME eq Dentora.exe" 2>/dev/null | grep -qi "dentora.exe"; }
          stop() { taskkill //F //IM Dentora.exe >/dev/null 2>&1 || true; sleep 2; }
          launch() { mkdir -p "$2"; DENTORA_USER_DATA="$(cygpath -w "$2")" "$1" "${@:3}" >/dev/null 2>&1 & }

          # 1) the build as shipped starts and loads its page
          launch release/win-unpacked/Dentora.exe "$T/ok"
          if ! started "$T/ok" 60; then cat "$T/ok/logs/main.log" 2>/dev/null; stop; echo "::error::Dentora.exe did not start"; exit 1; fi
          sleep 8
          cat "$T/ok/logs/main.log"
          if ! running; then echo "::error::Dentora.exe stopped right after starting"; exit 1; fi
          if grep -Eq "load failed|renderer gone" "$T/ok/logs/main.log"; then stop; echo "::error::the page did not load"; exit 1; fi
          stop

          # 2) a debugging port is refused
          launch release/win-unpacked/Dentora.exe "$T/dbg" --remote-debugging-port=9333
          sleep 10
          if curl -s -m 3 http://127.0.0.1:9333/json >/dev/null; then stop; echo "::error::the debugging port answered"; exit 1; fi
          if running; then stop; echo "::error::Dentora.exe kept running with --remote-debugging-port"; exit 1; fi
          grep "refused to start" "$T/dbg/logs/main.log"

          # 3) a copy whose app.asar was changed after the build (one hex digit of a file hash in its header: still a valid
          #    archive, but not the one whose hash is embedded in Dentora.exe) must not start
          cp -r release/win-unpacked "$T/tampered"
          node -e 'const a=require("@electron/asar"),fs=require("fs");const f=process.argv[1];const h=a.getRawHeader(f).headerString;const i=h.indexOf("\"hash\":\"")+8;const p=16+Buffer.byteLength(h.slice(0,i));const b=fs.readFileSync(f);b[p]=b[p]===0x61?0x62:0x61;fs.writeFileSync(f,b);JSON.parse(a.getRawHeader(f).headerString)' "$(cygpath -w "$T/tampered/resources/app.asar")"
          launch "$T/tampered/Dentora.exe" "$T/tampered-data"
          if started "$T/tampered-data" 25; then stop; echo "::error::Dentora.exe ran a modified app.asar: asar integrity validation is off"; exit 1; fi
          stop
          echo "packaged Dentora.exe: starts, refuses a debugging port, refuses a modified app.asar"

      - name: Smoke-test the app on Windows (window, bridge, MachineGuid device id, data survives restart)
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/qa/electron.mjs

      - name: List the files
        run: |
          ls -la release
          {
            echo "### Dentora ${{ steps.version.outputs.version }} for Windows"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in release/*.exe; do
              echo "| $(basename "$f") | $(( $(stat -c %s "$f") / 1048576 )) MB | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo ""
            echo "Download: this run → Artifacts → **Dentora-windows**."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Dentora-windows
          path: |
            dental/release/*.exe
            dental/release/*.blockmap
          if-no-files-found: error
          retention-days: 90

      # screenshots of the Windows smoke test (window, signed-in shell, English, a PDF), for checking a failed run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dentora-windows-qa
          path: dental/qa-shots/electron
          if-no-files-found: ignore
          retention-days: 14
