# The Kaseb license server (Cloudflare Worker + D1): online activation, periodic verification and the
# seller's codes page at /admin. Deployed by .github/workflows/deploy-pos-server.yml — see README.md.
name = "kaseb-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# The public address (landing page + /admin) and the workers.dev address the apps were built with: both stay on.
workers_dev = true
routes = [{ pattern = "kaseb.raqeem.dev", custom_domain = true }]

# Static files: the Android APK at /download/Kaseb.apk and the landing page images under /img/.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "kaseb"
# The deploy workflow creates the database the first time and writes its id here.
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (never in this file): LICENSE_SECRET derives the signing key of every license token,
# ADMIN_KEY opens the codes page. Set by the deploy workflow from the repository secrets.

# Cloud backups of the shops that subscribe (yearly plan): the compressed files live in Workers KV,
# their list in the D1 table `backups`. The deploy workflow creates the namespace the first time and writes its id here.
[[kv_namespaces]]
binding = "BACKUPS"
id = "00000000000000000000000000000000"

# Nightly cleanup: events older than a year are deleted (src/index.ts `scheduled`).
[triggers]
crons = ["0 3 * * *"]

# Big downloads (the Windows installer) that do not fit the static-asset limit.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kaseb-files"
