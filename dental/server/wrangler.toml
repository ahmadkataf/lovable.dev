# Dentora's Cloudflare Worker (details and deploy steps: server/README.md).
# The name must stay "dentora-api": it is the Worker already created in the Cloudflare account, so `wrangler deploy`
# updates that same Worker instead of creating a new one.
name = "dentora-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
account_id = "c79a8e91efac74d2e119e7e406c4db43"

# Production: the custom domain dentora.raqeem.dev (zone raqeem.dev). The workers.dev address stays on as well:
# https://dentora-api.almutafawiqin.workers.dev
workers_dev = true
routes = [
  { pattern = "dentora.raqeem.dev", custom_domain = true },
]

# Deploying needs CLOUDFLARE_API_TOKEN in the environment (never in this file or the repository).
