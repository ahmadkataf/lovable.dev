# Dentora — Windows packaging with electron-builder 26.
#   npm run electron:build            → release/Dentora-Setup-<version>.exe and release/Dentora-Portable-<version>.exe
#   npx electron-builder --win --dir  → release/win-unpacked/ (no installer; quick check)
# The version comes from package.json. Build on Windows or in GitHub Actions (.github/workflows/dentora-windows.yml).

appId: com.dentora.app
productName: Dentora
copyright: Copyright © 2026 Dentora
# Publisher shown in "Apps & features" / the installer (package.json has no "author"; injected here only)
extraMetadata:
  author:
    name: Dentora

directories:
  output: release
  buildResources: build

# The renderer is fully bundled by Vite into dist/, so the app needs no node_modules at run time.
files:
  - dist/**
  - electron/**
  - build/icon.png
  - build/icon.ico
  - package.json
  - "!**/node_modules/**"
asar: true
# nothing is uploaded anywhere (the GitHub workflow keeps the files as an artifact)
publish: null
npmRebuild: false
nodeGypRebuild: false
# Chromium UI locales to keep (Arabic + English); the rest are dropped to save ~40 MB
electronLanguages:
  - ar
  - en-US
  - en-GB

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    # Only used to verify signed updates. Once you sign, set it to the certificate's "Issued to" name.
    publisherName: Dentora

nsis:
  artifactName: Dentora-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Dentora
  uninstallDisplayName: Dentora
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Arabic first; the installer follows the Windows display language (Arabic or English)
  installerLanguages:
    - ar_SA
    - en_US
  language: "1025"
  runAfterFinish: true
  # NEVER delete %APPDATA%\Dentora: it holds the clinic's patients, invoices and files (IndexedDB).
  deleteAppDataOnUninstall: false

portable:
  artifactName: Dentora-Portable-${version}.exe
