# SUFIX — the API runs on Cloudflare Workers, the data lives in D1 (SQLite), the site is served from dist/
name = "sufix"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sufix"
database_id = "REPLACE_WITH_DATABASE_ID"

[observability]
enabled = true
