<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- gear -->
  <g transform="translate(256 236)">
    <g fill="url(#or)">
      <circle r="118"/>
      <g id="t"><rect x="-22" y="-160" width="44" height="60" rx="8"/></g>
      <use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(135)"/>
      <use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(315)"/>
    </g>
    <circle r="70" fill="#0f172a"/>
    <!-- wrench -->
    <g fill="#f8fafc" transform="rotate(-45)">
      <rect x="-13" y="-8" width="26" height="76" rx="7"/>
      <path d="M-30 -52 a30 30 0 1 1 60 0 v18 l-14 12 h-32 l-14 -12 z"/>
      <rect x="-9" y="-58" width="18" height="24" fill="#0f172a"/>
    </g>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="74" fill="#f8fafc">الرضوان</text>
</svg>
